<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Textures</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Textures. Model by Google Poly. Film by Studio Ghibli.</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Geometry, Mesh, Box } from '../src/index.js';

            const vertex = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMap, tMapSampler, input.vUv).rgb;
                    let normal = normalize(input.vNormal);

                    let light = normalize(vec3f(0.5, 1.0, -0.3));
                    let shading = dot(normal, light) * 0.15;

                    return vec4f(tex + shading, 1.0);
                }
            `;

            // Box geometry generates attributes in order: position, normal, uv, index
            // so for the box vertex shader we need position(@0), normal(@1), uv(@2)
            const boxVertex = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(3, 1.5, 4);
                camera.lookAt([1, 0.2, 0]);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                // Upload empty texture while source loading
                const texture = new Texture(renderer);

                // update image value with source once loaded
                const img = new Image();
                img.src = 'assets/saddle.jpg';
                img.onload = () => (texture.image = img);

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                });

                let mesh;
                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/saddle.json`)).json();

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                    });

                    mesh = new Mesh(renderer, { geometry, program });
                    mesh.position.set(0, 0, 0);
                    mesh.setParent(scene);
                }

                const videoGeometry = new Box(renderer, { width: 1.78, height: 1, depth: 1.78 });

                // Init empty texture while source loading
                const videoTexture = new Texture(renderer, {
                    generateMipmaps: false,
                    width: 1024,
                    height: 512,
                });

                // Create video with attributes that let it autoplay
                let video = document.createElement('video');
                video.src = 'assets/laputa.mp4';

                // Disclaimer: video autoplay is a confusing, constantly-changing browser feature.
                video.loop = true;
                video.muted = true;
                video.setAttribute('playsinline', 'playsinline');
                video.play();

                const videoProgram = new Program(renderer, {
                    vertex: boxVertex,
                    fragment,
                    uniforms: {
                        tMap: { value: videoTexture },
                    },
                    cullFace: false,
                });
                const videoMesh = new Mesh(renderer, {
                    geometry: videoGeometry,
                    program: videoProgram,
                });
                videoMesh.position.set(0, 0.5, -4);
                videoMesh.scale.set(1.5);
                videoMesh.setParent(scene);

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    // Attach video and/or update texture when video is ready
                    if (video.readyState >= video.HAVE_ENOUGH_DATA) {
                        if (!videoTexture.image) videoTexture.image = video;
                        videoTexture.needsUpdate = true;
                    }

                    if (mesh) mesh.rotation.y -= 0.005;
                    videoMesh.rotation.y += 0.003;
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
