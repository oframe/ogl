<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Wireframe</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Wireframe. Model by Google Poly</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Geometry, Mesh } from '../src/index.js';

            const vertex = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMap, tMapSampler, input.vUv).rgb;
                    let normal = normalize(input.vNormal);

                    let light = normalize(vec3f(0.5, 1.0, -0.3));
                    let shading = dot(normal, light) * 0.15;

                    let color = tex + shading;
                    return vec4f(color, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(5, 3, 6);
                camera.lookAt([0, 0, 0]);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const texture = new Texture(renderer);
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/croissant.jpg';

                // In WebGPU, topology (draw mode) is set on the Program, not the Mesh.
                // We need separate programs for each topology.

                // line-strip is the closest WebGPU equivalent to gl.LINE_LOOP
                const lineStripProgram = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                    topology: 'line-strip',
                });

                // line-list is the WebGPU equivalent to gl.LINES
                const lineListProgram = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                    topology: 'line-list',
                });

                let lineLoopMesh, wireframeMesh;
                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/croissant.json`)).json();

                    // Regular geometry with no modifications to be used with line-strip version
                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                    });

                    // Using line-strip topology will give an approximate wireframe.
                    // This is a simpler, lighter option if accuracy is not important (i.e. debugging).
                    // Note: WebGPU does not have LINE_LOOP, so line-strip is the closest equivalent
                    // (it does not connect the last vertex back to the first).
                    lineLoopMesh = new Mesh(renderer, { geometry, program: lineStripProgram });
                    lineLoopMesh.setParent(scene);
                    lineLoopMesh.position.y = 1;

                    // For an accurate wireframe, triangle vertices need to be duplicated to make line pairs.
                    // Here we do so by generating indices. If your geometry is already indexed, this needs to be adjusted.
                    let index = new Uint16Array((data.position.length / 3 / 3) * 6);
                    for (let i = 0; i < data.position.length / 3; i += 3) {
                        // For every triangle, make three line pairs (start, end)
                        index.set([i, i + 1, i + 1, i + 2, i + 2, i], i * 2);
                    }

                    const wireframeGeometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                        index: { data: index },
                    });

                    // Use the line-list topology (equivalent to gl.LINES)
                    wireframeMesh = new Mesh(renderer, { geometry: wireframeGeometry, program: lineListProgram });
                    wireframeMesh.setParent(scene);
                    wireframeMesh.position.y = -1;
                }

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    if (lineLoopMesh) lineLoopMesh.rotation.y -= 0.005;
                    if (wireframeMesh) wireframeMesh.rotation.y += 0.005;

                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
