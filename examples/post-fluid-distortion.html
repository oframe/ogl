<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Post Fluid Distortion</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">
            Post Fluid Distortion. Based on shaders by
            <a href="https://github.com/PavelDoGreat/WebGL-Fluid-Simulation" target="_blank">Pavel Dobryakov</a>
        </div>
        <script type="module">
            import { Renderer, Camera, RenderTarget, Geometry, Program, Mesh, Color, Vec2, Box, NormalProgram, Post } from '../src/index.js';

            // Post pass fragment: composites the fluid distortion over the scene
            // Uniforms: uTime (f32) => binding 0 uniform buffer
            // Textures (in JS insertion order): tFluid (user-defined), then tMap (appended by Post.addPass)
            //   tFluid => binding 1 (texture), binding 2 (sampler)
            //   tMap   => binding 3 (texture), binding 4 (sampler)
            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tFluidTex : texture_2d<f32>;
                @group(0) @binding(2) var tFluidSampler : sampler;
                @group(0) @binding(3) var tMapTex : texture_2d<f32>;
                @group(0) @binding(4) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let fluid = textureSample(tFluidTex, tFluidSampler, input.vUv).rgb;
                    let uv = input.vUv - fluid.rg * 0.0002;

                    let sceneColor = textureSample(tMapTex, tMapSampler, uv);
                    let fluidColor = vec4f(fluid * 0.1 + 0.5, 1.0);
                    return mix(sceneColor, fluidColor, step(0.5, input.vUv.x));
                }
            `;

            // Base vertex for fluid simulation passes: computes neighbor UVs for texel sampling
            // Uniforms: texelSize (vec2f) => binding 0 uniform buffer
            // Attributes: position (vec2f) @location(0), uv (vec2f) @location(1)
            const baseVertex = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct VertexInput {
                    @location(0) position : vec2f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vL : vec2f,
                    @location(2) vR : vec2f,
                    @location(3) vT : vec2f,
                    @location(4) vB : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    let uv = vec2f(input.uv.x, 1.0 - input.uv.y);
                    output.vUv = uv;
                    output.vL = uv - vec2f(material.texelSize.x, 0.0);
                    output.vR = uv + vec2f(material.texelSize.x, 0.0);
                    output.vT = uv + vec2f(0.0, material.texelSize.y);
                    output.vB = uv - vec2f(0.0, material.texelSize.y);
                    output.position = vec4f(input.position, 0.0, 1.0);
                    return output;
                }
            `;

            // Clear shader
            // Uniforms: texelSize (vec2f, from baseVertex), value (f32) => in uniform buffer
            // Textures: uTexture => binding 1 (texture), binding 2 (sampler)
            const clearShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                    value : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uTextureTex : texture_2d<f32>;
                @group(0) @binding(2) var uTextureSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    return material.value * textureSample(uTextureTex, uTextureSampler, input.vUv);
                }
            `;

            // Splat shader
            // Uniforms: texelSize (vec2f), aspectRatio (f32), radius (f32), point (vec2f), color (vec3f)
            // Textures: uTarget
            const splatShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                    aspectRatio : f32,
                    radius : f32,
                    point : vec2f,
                    color : vec3f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uTargetTex : texture_2d<f32>;
                @group(0) @binding(2) var uTargetSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    var p = input.vUv - material.point;
                    p.x *= material.aspectRatio;
                    let splat = exp(-dot(p, p) / material.radius) * material.color;
                    let base = textureSample(uTargetTex, uTargetSampler, input.vUv).xyz;
                    return vec4f(base + splat, 1.0);
                }
            `;

            // Advection shader (with linear filtering support — WebGPU always supports linear filtering on float textures if the feature is enabled)
            // Uniforms: texelSize (vec2f), dyeTexelSize (vec2f), dt (f32), dissipation (f32)
            // Textures: uVelocity, uSource
            const advectionShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                    dyeTexelSize : vec2f,
                    dt : f32,
                    dissipation : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uVelocityTex : texture_2d<f32>;
                @group(0) @binding(2) var uVelocitySampler : sampler;
                @group(0) @binding(3) var uSourceTex : texture_2d<f32>;
                @group(0) @binding(4) var uSourceSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let coord = input.vUv - material.dt * textureSample(uVelocityTex, uVelocitySampler, input.vUv).xy * material.texelSize;
                    var col = material.dissipation * textureSample(uSourceTex, uSourceSampler, coord);
                    col.a = 1.0;
                    return col;
                }
            `;

            // Divergence shader
            // Uniforms: texelSize (vec2f) => in uniform buffer
            // Textures: uVelocity
            const divergenceShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uVelocityTex : texture_2d<f32>;
                @group(0) @binding(2) var uVelocitySampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vL : vec2f,
                    @location(2) vR : vec2f,
                    @location(3) vT : vec2f,
                    @location(4) vB : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    var L = textureSample(uVelocityTex, uVelocitySampler, input.vL).x;
                    var R = textureSample(uVelocityTex, uVelocitySampler, input.vR).x;
                    var T = textureSample(uVelocityTex, uVelocitySampler, input.vT).y;
                    var B = textureSample(uVelocityTex, uVelocitySampler, input.vB).y;
                    let C = textureSample(uVelocityTex, uVelocitySampler, input.vUv).xy;
                    if (input.vL.x < 0.0) { L = -C.x; }
                    if (input.vR.x > 1.0) { R = -C.x; }
                    if (input.vT.y > 1.0) { T = -C.y; }
                    if (input.vB.y < 0.0) { B = -C.y; }
                    let div = 0.5 * (R - L + T - B);
                    return vec4f(div, 0.0, 0.0, 1.0);
                }
            `;

            // Curl shader
            // Uniforms: texelSize (vec2f) => in uniform buffer
            // Textures: uVelocity
            const curlShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uVelocityTex : texture_2d<f32>;
                @group(0) @binding(2) var uVelocitySampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vL : vec2f,
                    @location(2) vR : vec2f,
                    @location(3) vT : vec2f,
                    @location(4) vB : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let L = textureSample(uVelocityTex, uVelocitySampler, input.vL).y;
                    let R = textureSample(uVelocityTex, uVelocitySampler, input.vR).y;
                    let T = textureSample(uVelocityTex, uVelocitySampler, input.vT).x;
                    let B = textureSample(uVelocityTex, uVelocitySampler, input.vB).x;
                    let vorticity = R - L - T + B;
                    return vec4f(0.5 * vorticity, 0.0, 0.0, 1.0);
                }
            `;

            // Vorticity shader
            // Uniforms: texelSize (vec2f), curl (f32), dt (f32)
            // Textures: uVelocity, uCurl
            const vorticityShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                    curl : f32,
                    dt : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uVelocityTex : texture_2d<f32>;
                @group(0) @binding(2) var uVelocitySampler : sampler;
                @group(0) @binding(3) var uCurlTex : texture_2d<f32>;
                @group(0) @binding(4) var uCurlSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vL : vec2f,
                    @location(2) vR : vec2f,
                    @location(3) vT : vec2f,
                    @location(4) vB : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let L = textureSample(uCurlTex, uCurlSampler, input.vL).x;
                    let R = textureSample(uCurlTex, uCurlSampler, input.vR).x;
                    let T = textureSample(uCurlTex, uCurlSampler, input.vT).x;
                    let B = textureSample(uCurlTex, uCurlSampler, input.vB).x;
                    let C = textureSample(uCurlTex, uCurlSampler, input.vUv).x;
                    var force = 0.5 * vec2f(abs(T) - abs(B), abs(R) - abs(L));
                    force /= length(force) + 0.0001;
                    force *= material.curl * C;
                    force.y *= -1.0;
                    let vel = textureSample(uVelocityTex, uVelocitySampler, input.vUv).xy;
                    return vec4f(vel + force * material.dt, 0.0, 1.0);
                }
            `;

            // Pressure shader
            // Uniforms: texelSize (vec2f) => in uniform buffer
            // Textures: uPressure, uDivergence
            const pressureShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uPressureTex : texture_2d<f32>;
                @group(0) @binding(2) var uPressureSampler : sampler;
                @group(0) @binding(3) var uDivergenceTex : texture_2d<f32>;
                @group(0) @binding(4) var uDivergenceSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vL : vec2f,
                    @location(2) vR : vec2f,
                    @location(3) vT : vec2f,
                    @location(4) vB : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let L = textureSample(uPressureTex, uPressureSampler, input.vL).x;
                    let R = textureSample(uPressureTex, uPressureSampler, input.vR).x;
                    let T = textureSample(uPressureTex, uPressureSampler, input.vT).x;
                    let B = textureSample(uPressureTex, uPressureSampler, input.vB).x;
                    let C = textureSample(uPressureTex, uPressureSampler, input.vUv).x;
                    let divergence = textureSample(uDivergenceTex, uDivergenceSampler, input.vUv).x;
                    let pressure = (L + R + B + T - divergence) * 0.25;
                    return vec4f(pressure, 0.0, 0.0, 1.0);
                }
            `;

            // Gradient subtract shader
            // Uniforms: texelSize (vec2f) => in uniform buffer
            // Textures: uPressure, uVelocity
            const gradientSubtractShader = /* wgsl */ `
                struct MaterialUniforms {
                    texelSize : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var uPressureTex : texture_2d<f32>;
                @group(0) @binding(2) var uPressureSampler : sampler;
                @group(0) @binding(3) var uVelocityTex : texture_2d<f32>;
                @group(0) @binding(4) var uVelocitySampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vL : vec2f,
                    @location(2) vR : vec2f,
                    @location(3) vT : vec2f,
                    @location(4) vB : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let L = textureSample(uPressureTex, uPressureSampler, input.vL).x;
                    let R = textureSample(uPressureTex, uPressureSampler, input.vR).x;
                    let T = textureSample(uPressureTex, uPressureSampler, input.vT).x;
                    let B = textureSample(uPressureTex, uPressureSampler, input.vB).x;
                    var velocity = textureSample(uVelocityTex, uVelocitySampler, input.vUv).xy;
                    velocity -= vec2f(R - L, T - B);
                    return vec4f(velocity, 0.0, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 1, 5);
                camera.lookAt([0, 0, 0]);

                const post = new Post(renderer);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                    post.resize();
                }
                window.addEventListener('resize', resize, false);
                resize();

                // Helper to create a ping-pong FBO pairing for simulating on GPU
                function createDoubleFBO({ width, height, format = 'rgba16float', depth = false } = {}) {
                    const options = { width, height, format, depth };
                    const fbo = {
                        read: new RenderTarget(renderer, options),
                        write: new RenderTarget(renderer, options),
                        swap: () => {
                            let temp = fbo.read;
                            fbo.read = fbo.write;
                            fbo.write = temp;
                        },
                    };
                    return fbo;
                }

                // Resolution of simulation
                const simRes = 128;
                const dyeRes = 512;

                // Main inputs to control look and feel of fluid
                const iterations = 3;
                const densityDissipation = 0.97;
                const velocityDissipation = 0.98;
                const pressureDissipation = 0.8;
                const curlStrength = 20;
                const radius = 0.2;

                // Common uniform
                const texelSize = { value: new Vec2(1 / simRes) };

                // Create fluid simulation FBOs
                const density = createDoubleFBO({
                    width: dyeRes,
                    height: dyeRes,
                    format: 'rgba16float',
                });

                const velocity = createDoubleFBO({
                    width: simRes,
                    height: simRes,
                    format: 'rgba16float',
                });

                const pressure = createDoubleFBO({
                    width: simRes,
                    height: simRes,
                    format: 'rgba16float',
                });

                const divergence = new RenderTarget(renderer, {
                    width: simRes,
                    height: simRes,
                    format: 'rgba16float',
                    depth: false,
                });

                const curl = new RenderTarget(renderer, {
                    width: simRes,
                    height: simRes,
                    format: 'rgba16float',
                    depth: false,
                });

                // Geometry to be used for the simulation programs
                const triangle = new Geometry(renderer, {
                    position: { size: 2, data: new Float32Array([-1, -1, 3, -1, -1, 3]) },
                    uv: { size: 2, data: new Float32Array([0, 0, 2, 0, 0, 2]) },
                });

                // Create fluid simulation programs
                // Note: In WebGPU, texture uniforms must not be null at construction time
                // because Program.js builds the bind group layout once. We use the FBO
                // read textures as initial placeholders — they get overwritten each frame.
                const clearProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: clearShader,
                        uniforms: {
                            texelSize,
                            value: { value: pressureDissipation },
                            uTexture: { value: pressure.read.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const splatProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: splatShader,
                        uniforms: {
                            texelSize,
                            aspectRatio: { value: 1 },
                            radius: { value: radius / 100 },
                            point: { value: new Vec2() },
                            color: { value: new Color() },
                            uTarget: { value: velocity.read.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const advectionProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: advectionShader,
                        uniforms: {
                            texelSize,
                            dyeTexelSize: { value: new Vec2(1 / dyeRes) },
                            dt: { value: 0.016 },
                            dissipation: { value: 1 },
                            uVelocity: { value: velocity.read.texture },
                            uSource: { value: velocity.read.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const divergenceProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: divergenceShader,
                        uniforms: {
                            texelSize,
                            uVelocity: { value: velocity.read.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const curlProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: curlShader,
                        uniforms: {
                            texelSize,
                            uVelocity: { value: velocity.read.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const vorticityProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: vorticityShader,
                        uniforms: {
                            texelSize,
                            curl: { value: curlStrength },
                            dt: { value: 0.016 },
                            uVelocity: { value: velocity.read.texture },
                            uCurl: { value: curl.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const pressureProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: pressureShader,
                        uniforms: {
                            texelSize,
                            uPressure: { value: pressure.read.texture },
                            uDivergence: { value: divergence.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const gradientSubtractProgram = new Mesh(renderer, {
                    geometry: triangle,
                    program: new Program(renderer, {
                        vertex: baseVertex,
                        fragment: gradientSubtractShader,
                        uniforms: {
                            texelSize,
                            uPressure: { value: pressure.read.texture },
                            uVelocity: { value: velocity.read.texture },
                        },
                        depthTest: false,
                        depthWrite: false,
                    }),
                });

                const splats = [];

                // Create handlers to get mouse position and velocity
                const isTouchCapable = 'ontouchstart' in window;
                if (isTouchCapable) {
                    window.addEventListener('touchstart', updateMouse, false);
                    window.addEventListener('touchmove', updateMouse, false);
                } else {
                    window.addEventListener('mousemove', updateMouse, false);
                }

                const lastMouse = new Vec2();
                function updateMouse(e) {
                    if (e.changedTouches && e.changedTouches.length) {
                        e.x = e.changedTouches[0].pageX;
                        e.y = e.changedTouches[0].pageY;
                    }
                    if (e.x === undefined) {
                        e.x = e.pageX;
                        e.y = e.pageY;
                    }

                    if (!lastMouse.isInit) {
                        lastMouse.isInit = true;

                        // First input
                        lastMouse.set(e.x, e.y);
                    }

                    const deltaX = e.x - lastMouse.x;
                    const deltaY = e.y - lastMouse.y;

                    lastMouse.set(e.x, e.y);

                    // Add if the mouse is moving
                    if (Math.abs(deltaX) || Math.abs(deltaY)) {
                        splats.push({
                            // Get mouse value in 0 to 1 range
                            x: e.x / renderer.width,
                            y: e.y / renderer.height,
                            dx: deltaX * 5,
                            dy: deltaY * 5,
                        });
                    }
                }

                // Function to draw number of interactions onto input render target
                function splat({ x, y, dx, dy }) {
                    splatProgram.program.uniforms.uTarget.value = velocity.read.texture;
                    splatProgram.program.uniforms.aspectRatio.value = renderer.width / renderer.height;
                    splatProgram.program.uniforms.point.value.set(x, y);
                    splatProgram.program.uniforms.color.value.set(dx, dy, 1);

                    renderer.render({
                        scene: splatProgram,
                        target: velocity.write,
                        sort: false,
                        update: false,
                    });
                    velocity.swap();

                    splatProgram.program.uniforms.uTarget.value = density.read.texture;

                    renderer.render({
                        scene: splatProgram,
                        target: density.write,
                        sort: false,
                        update: false,
                    });
                    density.swap();
                }

                // Create initial scene
                const geometry = new Box(renderer);
                const mesh = new Mesh(renderer, { geometry, program: new NormalProgram(renderer) });

                for (let i = 0; i < 20; i++) {
                    const m = new Mesh(renderer, { geometry, program: new NormalProgram(renderer) });
                    m.position.set(Math.random() * 3 - 1.5, Math.random() * 3 - 1.5, Math.random() * 3 - 1.5);
                    m.rotation.set(Math.random() * 6.28 - 3.14, Math.random() * 6.28 - 3.14, 0);
                    m.scale.set(Math.random() * 0.5 + 0.1);
                    m.setParent(mesh);
                }

                const pass = post.addPass({
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        tFluid: { value: density.read.texture },
                    },
                });

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    // Perform all of the fluid simulation renders
                    // No need to clear during sim, saving a number of GPU calls.
                    renderer.autoClear = false;

                    // Render all of the inputs since last frame
                    for (let i = splats.length - 1; i >= 0; i--) {
                        splat(splats.splice(i, 1)[0]);
                    }

                    curlProgram.program.uniforms.uVelocity.value = velocity.read.texture;

                    renderer.render({
                        scene: curlProgram,
                        target: curl,
                        sort: false,
                        update: false,
                    });

                    vorticityProgram.program.uniforms.uVelocity.value = velocity.read.texture;
                    vorticityProgram.program.uniforms.uCurl.value = curl.texture;

                    renderer.render({
                        scene: vorticityProgram,
                        target: velocity.write,
                        sort: false,
                        update: false,
                    });
                    velocity.swap();

                    divergenceProgram.program.uniforms.uVelocity.value = velocity.read.texture;

                    renderer.render({
                        scene: divergenceProgram,
                        target: divergence,
                        sort: false,
                        update: false,
                    });

                    clearProgram.program.uniforms.uTexture.value = pressure.read.texture;

                    renderer.render({
                        scene: clearProgram,
                        target: pressure.write,
                        sort: false,
                        update: false,
                    });
                    pressure.swap();

                    pressureProgram.program.uniforms.uDivergence.value = divergence.texture;

                    for (let i = 0; i < iterations; i++) {
                        pressureProgram.program.uniforms.uPressure.value = pressure.read.texture;

                        renderer.render({
                            scene: pressureProgram,
                            target: pressure.write,
                            sort: false,
                            update: false,
                        });
                        pressure.swap();
                    }

                    gradientSubtractProgram.program.uniforms.uPressure.value = pressure.read.texture;
                    gradientSubtractProgram.program.uniforms.uVelocity.value = velocity.read.texture;

                    renderer.render({
                        scene: gradientSubtractProgram,
                        target: velocity.write,
                        sort: false,
                        update: false,
                    });
                    velocity.swap();

                    advectionProgram.program.uniforms.dyeTexelSize.value.set(1 / simRes);
                    advectionProgram.program.uniforms.uVelocity.value = velocity.read.texture;
                    advectionProgram.program.uniforms.uSource.value = velocity.read.texture;
                    advectionProgram.program.uniforms.dissipation.value = velocityDissipation;

                    renderer.render({
                        scene: advectionProgram,
                        target: velocity.write,
                        sort: false,
                        update: false,
                    });
                    velocity.swap();

                    advectionProgram.program.uniforms.dyeTexelSize.value.set(1 / dyeRes);
                    advectionProgram.program.uniforms.uVelocity.value = velocity.read.texture;
                    advectionProgram.program.uniforms.uSource.value = density.read.texture;
                    advectionProgram.program.uniforms.dissipation.value = densityDissipation;

                    renderer.render({
                        scene: advectionProgram,
                        target: density.write,
                        sort: false,
                        update: false,
                    });
                    density.swap();

                    // Set clear back to default
                    renderer.autoClear = true;

                    // Update post pass uniform with the simulation output
                    pass.uniforms.tFluid.value = density.read.texture;

                    mesh.rotation.y -= 0.0025;
                    mesh.rotation.x -= 0.005;

                    pass.uniforms.uTime.value = t * 0.001;

                    // Replace Renderer.render with post.render. Use the same arguments.
                    post.render({ scene: mesh, camera });
                }
            }
        </script>
    </body>
</html>
