<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Flat Shading Matcap</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Flat Shading Matcap. Model by Google Poly.</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Geometry, Mesh, Vec3, Orbit } from '../src/index.js';

            const vertex = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vMVPos : vec4f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vMVPos = object.modelViewMatrix * vec4f(input.position, 1.0);
                    output.position = object.projectionMatrix * output.vMVPos;
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vMVPos : vec4f,
                };

                fn normals(pos : vec3f) -> vec3f {
                    let fdx = dpdx(pos);
                    let fdy = -dpdy(pos);
                    return normalize(cross(fdx, fdy));
                }

                fn matcap(eye : vec3f, normal : vec3f) -> vec2f {
                    let reflected = reflect(eye, normal);
                    let m = 2.8284271247461903 * sqrt(reflected.z + 1.0);
                    return reflected.xy / m + 0.5;
                }

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let normal = normals(input.vMVPos.xyz);

                    // We're using the matcap to add some shininess to the model
                    let mat = textureSample(tMap, tMapSampler, matcap(normalize(input.vMVPos.xyz), normal)).g;

                    return vec4f(normal + mat, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(2, 1, 2);

                const controls = new Orbit(camera, {
                    target: new Vec3(0, 0.2, 0),
                });

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const texture = new Texture(renderer);
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/matcap.jpg';

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                    cullFace: false,
                });

                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/octopus.json`)).json();

                    // If you can generate the flat-shaded normals with attributes, it would
                    // be more efficient. However if your mesh is dynamic, indexed, or you're
                    // updating the vertices in the shader, we can still calculate the normals
                    // in the shader - all we need is the position.
                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                    });

                    let mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
