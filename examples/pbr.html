<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL &bull; PBR</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info" style="color: #fff">PBR (Physically Based Rendering). Model by <a href="https://sketchfab.com/slava" target="_blank">Slava Z</a></div>
        <script type="module">
            import { Renderer, Transform, Camera, Geometry, Texture, Program, Mesh, Vec3, Color, Orbit, Plane } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uBaseColor : vec3f,
                    uRoughness : f32,
                    uMetallic : f32,
                    uOcclusion : f32,
                    uNormalScale : f32,
                    uNormalUVScale : f32,
                    uEmissive : f32,
                    uAlpha : f32,
                    uEnvSpecular : f32,
                    uLightDirection : vec3f,
                    uLightColor : vec3f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vMPos : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.vMPos = (object.modelMatrix * vec4f(input.position, 1.0)).xyz;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uBaseColor : vec3f,
                    uRoughness : f32,
                    uMetallic : f32,
                    uOcclusion : f32,
                    uNormalScale : f32,
                    uNormalUVScale : f32,
                    uEmissive : f32,
                    uAlpha : f32,
                    uEnvSpecular : f32,
                    uLightDirection : vec3f,
                    uLightColor : vec3f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                // Textures (group 0)
                @group(0) @binding(1) var tBaseColor : texture_2d<f32>;
                @group(0) @binding(2) var tBaseColorSampler : sampler;
                @group(0) @binding(3) var tRMO : texture_2d<f32>;
                @group(0) @binding(4) var tRMOSampler : sampler;
                @group(0) @binding(5) var tNormal : texture_2d<f32>;
                @group(0) @binding(6) var tNormalSampler : sampler;
                @group(0) @binding(7) var tEmissive : texture_2d<f32>;
                @group(0) @binding(8) var tEmissiveSampler : sampler;
                @group(0) @binding(9) var tOpacity : texture_2d<f32>;
                @group(0) @binding(10) var tOpacitySampler : sampler;
                @group(0) @binding(11) var tLUT : texture_2d<f32>;
                @group(0) @binding(12) var tLUTSampler : sampler;
                @group(0) @binding(13) var tEnvDiffuse : texture_2d<f32>;
                @group(0) @binding(14) var tEnvDiffuseSampler : sampler;
                @group(0) @binding(15) var tEnvSpecular : texture_2d<f32>;
                @group(0) @binding(16) var tEnvSpecularSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vMPos : vec3f,
                };

                const PI = 3.14159265359;
                const RECIPROCAL_PI = 0.31830988618;
                const RECIPROCAL_PI2 = 0.15915494;
                const LN2 = 0.6931472;

                const ENV_LODS = 6.0;

                fn SRGBtoLinear(srgb : vec4f) -> vec4f {
                    let linOut = pow(srgb.xyz, vec3f(2.2));
                    return vec4f(linOut, srgb.w);
                }

                fn RGBMToLinear(value : vec4f) -> vec4f {
                    let maxRange = 6.0;
                    return vec4f(value.xyz * value.w * maxRange, 1.0);
                }

                fn linearToSRGB(color : vec3f) -> vec3f {
                    return pow(color, vec3f(1.0 / 2.2));
                }

                fn getNormal(vMPos : vec3f, vUv : vec2f, vNormal : vec3f) -> vec3f {
                    let pos_dx = dpdx(vMPos.xyz);
                    let pos_dy = -dpdy(vMPos.xyz);
                    let tex_dx = dpdx(vUv);
                    let tex_dy = -dpdy(vUv);

                    let t = normalize(pos_dx * tex_dy.y - pos_dy * tex_dx.y);
                    let b = normalize(-pos_dx * tex_dy.x + pos_dy * tex_dx.x);
                    let tbn = mat3x3f(t, b, normalize(vNormal));

                    var n = textureSample(tNormal, tNormalSampler, vUv * material.uNormalUVScale).rgb * 2.0 - 1.0;
                    n = vec3f(n.x * material.uNormalScale, n.y * material.uNormalScale, n.z);
                    let normal = normalize(tbn * n);

                    // Get world normal from view normal (normalMatrix * normal)
                    return normalize((vec4f(normal, 0.0) * object.viewMatrix).xyz);
                }

                fn specularReflection(specularEnvR0 : vec3f, specularEnvR90 : vec3f, VdH : f32) -> vec3f {
                    return specularEnvR0 + (specularEnvR90 - specularEnvR0) * pow(clamp(1.0 - VdH, 0.0, 1.0), 5.0);
                }

                fn geometricOcclusion(NdL : f32, NdV : f32, roughness : f32) -> f32 {
                    let r = roughness;

                    let attenuationL = 2.0 * NdL / (NdL + sqrt(r * r + (1.0 - r * r) * (NdL * NdL)));
                    let attenuationV = 2.0 * NdV / (NdV + sqrt(r * r + (1.0 - r * r) * (NdV * NdV)));
                    return attenuationL * attenuationV;
                }

                fn microfacetDistribution(roughness : f32, NdH : f32) -> f32 {
                    let roughnessSq = roughness * roughness;
                    let f = (NdH * roughnessSq - NdH) * NdH + 1.0;
                    return roughnessSq / (PI * f * f);
                }

                fn cartesianToPolar(n : vec3f) -> vec2f {
                    var uv : vec2f;
                    uv.x = atan2(n.z, n.x) * RECIPROCAL_PI2 + 0.5;
                    uv.y = asin(n.y) * RECIPROCAL_PI + 0.5;
                    return uv;
                }

                struct IBLResult {
                    diffuse : vec3f,
                    specular : vec3f,
                };

                fn getIBLContribution(NdV : f32, roughness : f32, n : vec3f, reflection : vec3f, diffuseColor : vec3f, specularColor : vec3f) -> IBLResult {
                    let brdf = SRGBtoLinear(textureSample(tLUT, tLUTSampler, vec2f(NdV, roughness))).rgb;

                    let diffuseLight = RGBMToLinear(textureSample(tEnvDiffuse, tEnvDiffuseSampler, cartesianToPolar(n))).rgb;

                    // Sample 2 levels and mix between to get smoother degradation
                    var blend = roughness * ENV_LODS;
                    let level0 = floor(blend);
                    let level1 = min(ENV_LODS, level0 + 1.0);
                    blend -= level0;

                    // Sample the specular env map atlas depending on the roughness value
                    var uvSpec = cartesianToPolar(reflection);
                    uvSpec.y /= 2.0;

                    var uv0 = uvSpec;
                    var uv1 = uvSpec;

                    uv0 /= pow(2.0, level0);
                    uv0.y += 1.0 - exp(-LN2 * level0);

                    uv1 /= pow(2.0, level1);
                    uv1.y += 1.0 - exp(-LN2 * level1);

                    let specular0 = RGBMToLinear(textureSample(tEnvSpecular, tEnvSpecularSampler, uv0)).rgb;
                    let specular1 = RGBMToLinear(textureSample(tEnvSpecular, tEnvSpecularSampler, uv1)).rgb;
                    let specularLight = mix(specular0, specular1, blend);

                    let diffuse = diffuseLight * diffuseColor;

                    // Bit of extra reflection for smooth materials
                    let reflectivity = pow((1.0 - roughness), 2.0) * 0.05;
                    var specular = specularLight * (specularColor * brdf.x + brdf.y + reflectivity);
                    specular *= material.uEnvSpecular;

                    return IBLResult(diffuse, specular);
                }

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let baseColor = SRGBtoLinear(textureSample(tBaseColor, tBaseColorSampler, input.vUv)).rgb * material.uBaseColor;

                    // RMO map packed as rgb = [roughness, metallic, occlusion]
                    let rmaSample = textureSample(tRMO, tRMOSampler, input.vUv);
                    let roughness = clamp(rmaSample.r * material.uRoughness, 0.04, 1.0);
                    let metallic = clamp(rmaSample.g * material.uMetallic, 0.04, 1.0);

                    let f0 = vec3f(0.04);
                    let diffuseColor = baseColor * (vec3f(1.0) - f0) * (1.0 - metallic);
                    let specularColor = mix(f0, baseColor, metallic);

                    let specularEnvR0 = specularColor;
                    let specularEnvR90 = vec3f(clamp(max(max(specularColor.r, specularColor.g), specularColor.b) * 25.0, 0.0, 1.0));

                    let N = getNormal(input.vMPos, input.vUv, input.vNormal);
                    let V = normalize(object.cameraPosition - input.vMPos);
                    let L = normalize(material.uLightDirection);
                    let H = normalize(L + V);
                    let reflection = normalize(reflect(-V, N));

                    let NdL = clamp(dot(N, L), 0.001, 1.0);
                    let NdV = clamp(abs(dot(N, V)), 0.001, 1.0);
                    let NdH = clamp(dot(N, H), 0.0, 1.0);
                    let LdH = clamp(dot(L, H), 0.0, 1.0);
                    let VdH = clamp(dot(V, H), 0.0, 1.0);

                    let F = specularReflection(specularEnvR0, specularEnvR90, VdH);
                    let G = geometricOcclusion(NdL, NdV, roughness);
                    let D = microfacetDistribution(roughness, NdH);

                    let diffuseContrib = (1.0 - F) * (diffuseColor / PI);
                    let specContrib = F * G * D / (4.0 * NdL * NdV);

                    // Shading based off lights
                    var color = NdL * material.uLightColor * (diffuseContrib + specContrib);

                    // Get base alpha
                    var alpha = 1.0;
                    alpha *= textureSample(tOpacity, tOpacitySampler, input.vUv).g;

                    // Add lights spec to alpha for reflections on transparent surfaces (glass)
                    alpha = max(alpha, max(max(specContrib.r, specContrib.g), specContrib.b));

                    // Calculate IBL lighting
                    let ibl = getIBLContribution(NdV, roughness, N, reflection, diffuseColor, specularColor);

                    // Add IBL on top of color
                    color += ibl.diffuse + ibl.specular;

                    // Add IBL spec to alpha for reflections on transparent surfaces (glass)
                    alpha = max(alpha, max(max(ibl.specular.r, ibl.specular.g), ibl.specular.b));

                    // Multiply occlusion
                    color = mix(color, color * rmaSample.b, material.uOcclusion);

                    // Add emissive on top
                    let emissive = SRGBtoLinear(textureSample(tEmissive, tEmissiveSampler, input.vUv)).rgb * material.uEmissive;
                    color += emissive;

                    // Convert to sRGB to display
                    let finalColor = linearToSRGB(color);

                    // Apply uAlpha uniform at the end to overwrite any specular additions on transparent surfaces
                    return vec4f(finalColor, alpha * material.uAlpha);
                }
            `;

            const shadowVertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const shadowFragment = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let shadow = textureSample(tMap, tMapSampler, input.vUv).g;
                    return vec4f(0.0, 0.0, 0.0, shadow);
                }
            `;

            // Use this online tool to create the required IBL environment maps
            // https://oframe.github.io/ibl-converter/

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 0.1, g: 0.1, b: 0.1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(2, 0.5, 3);

                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();
                scene.position.y = -0.4;

                const textureCache = {};
                function getTexture(src, generateMipmaps = true) {
                    if (textureCache[src]) return textureCache[src];
                    const texture = new Texture(renderer, { generateMipmaps });
                    const image = new Image();
                    textureCache[src] = texture;
                    image.onload = () => {
                        texture.image = image;
                    };
                    image.src = src;
                    return texture;
                }

                loadExterior();
                loadInterior();
                loadShadow();

                async function loadExterior() {
                    const data = await (await fetch(`assets/pbr/car-ext.json`)).json();
                    const dataInner = await (await fetch(`assets/pbr/car-ext-inner.json`)).json();

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                    });

                    const geometryInner = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(dataInner.position) },
                        uv: { size: 2, data: new Float32Array(dataInner.uv) },
                        normal: { size: 3, data: new Float32Array(dataInner.normal) },
                    });

                    // This whole effect lives in the fairly epic shader.
                    const program = new Program(renderer, {
                        vertex,
                        fragment,
                        uniforms: {
                            // Base color / albedo. This is used to determine both the diffuse and specular colors.
                            tBaseColor: { value: getTexture('assets/pbr/car-ext-color.jpg') },

                            // This works as a multiplier for each channel in the texture above.
                            uBaseColor: { value: new Color(1, 1, 1) },

                            // 'Roughness', 'Metalness' and 'Occlusion', each packed into their own channel (R, G, B)
                            tRMO: { value: getTexture('assets/pbr/car-ext-rmo.jpg') },

                            // The following are multipliers to the above values
                            uRoughness: { value: 1 },
                            uMetallic: { value: 1 },
                            uOcclusion: { value: 1 },

                            // Just a regular normal map
                            tNormal: { value: getTexture('assets/pbr/car-ext-normal.jpg') },
                            uNormalScale: { value: 0.5 },
                            uNormalUVScale: { value: 1 },

                            // Emissive color is added at the very end to simulate light sources.
                            tEmissive: { value: getTexture('assets/pbr/car-ext-emissive.jpg') },
                            uEmissive: { value: 1 },

                            // Initial opacity is taken from the green channel of the map below.
                            // If a transparent area is smooth, the specular may increase the opacity.
                            // This is done to simulate specular reflections on transparent surfaces like glass.
                            tOpacity: { value: getTexture('assets/pbr/car-ext-opacity.jpg') },

                            // uAlpha is an overall alpha control. It is applied right at the end to hide the geometry.
                            // Specular reflections will not affect this value, unlike above.
                            uAlpha: { value: 1 },

                            // This Look Up Table is used to calculate the BRDF (Bidirectional reflectance distribution function)
                            // coefficients used in the shader more efficiently.
                            // It is based on the roughness and fresnel grazing angle.
                            tLUT: { value: getTexture('assets/pbr/lut.png', false) },

                            // The following two environment maps are the most important inputs.
                            // They can be generated using this online tool https://oframe.github.io/ibl-converter/
                            // They are equirectangular (a sphere mapped to a rectangle) maps used for lighting the model.
                            // Instead of just relying on lights, we use these textures as IBL (image-based lighting), which
                            // is like having thousands of lights in a scene.
                            // In order to get more realistic results, we use a HDR (high dynamic range) image as an input,
                            // so instead of values being limited between 0 and 1, they can go higher (up to 6 in this implementation).
                            // These images have been converted to an RGBM structure (where the rgb channels multiply with the
                            // alpha channel to recapture their original HDR value), as this allows us to store it in an 8 bit PNG.

                            // The first of the two maps is the diffuse irradiance. It's a small, blurry texture used to give
                            // ambient/diffuse lighting to the model.
                            tEnvDiffuse: { value: getTexture('assets/pbr/waterfall-diffuse-RGBM.png', false) },

                            // The second is the pre-filtered specular vertical atlas. It's basically 7 environment maps
                            // in one, with each step half the size of the previous and also a bit blurrier.
                            // It's used for specular reflections, with the different levels to be sampled depending on how
                            // rough the model is at that point.
                            // I've used an atlas instead of mipmaps or texture arrays for simplicity's sake.
                            tEnvSpecular: { value: getTexture('assets/pbr/waterfall-specular-RGBM.png', false) },

                            // This is a multiplier to the amount of specular. Especially useful if you don't have an HDR map.
                            uEnvSpecular: { value: 2 },

                            // One light is included, ideally to simulate the sun, and both specular and diffuse are calculated.
                            uLightDirection: { value: new Vec3(0, 1, 1) },

                            // Here I've pushed the white light beyond 1 to increase its effect.
                            uLightColor: { value: new Vec3(7) },
                        },
                        transparent: true,
                    });

                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);

                    const meshInner = new Mesh(renderer, { geometry: geometryInner, program });
                    meshInner.setParent(scene);
                }

                async function loadInterior() {
                    const data = await (await fetch(`assets/pbr/car-int.json`)).json();

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                    });

                    const program = new Program(renderer, {
                        vertex,
                        fragment,
                        uniforms: {
                            tBaseColor: { value: getTexture('assets/pbr/car-int-color.jpg') },
                            uBaseColor: { value: new Color(1, 1, 1) },

                            tRMO: { value: getTexture('assets/pbr/car-int-rmo.jpg') },
                            uRoughness: { value: 1 },
                            uMetallic: { value: 1 },
                            uOcclusion: { value: 1 },

                            tNormal: { value: getTexture('assets/pbr/car-int-normal.jpg') },
                            uNormalScale: { value: 0.5 },
                            uNormalUVScale: { value: 1 },

                            tEmissive: { value: getTexture('assets/pbr/black.jpg') },
                            uEmissive: { value: 1 },

                            tOpacity: { value: getTexture('assets/pbr/white.jpg') },
                            uAlpha: { value: 1 },

                            tLUT: { value: getTexture('assets/pbr/lut.png', false) },

                            tEnvDiffuse: { value: getTexture('assets/pbr/waterfall-diffuse-RGBM.png', false) },
                            tEnvSpecular: { value: getTexture('assets/pbr/waterfall-specular-RGBM.png', false) },
                            uEnvSpecular: { value: 1.0 },

                            uLightDirection: { value: new Vec3(1, 1, 1) },
                            uLightColor: { value: new Vec3(7) },
                        },
                    });

                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                function loadShadow() {
                    const geometry = new Plane(renderer, { width: 2.3, height: 2.3 });
                    const program = new Program(renderer, {
                        vertex: shadowVertex,
                        fragment: shadowFragment,
                        uniforms: {
                            tMap: { value: getTexture('assets/pbr/car-shadow.jpg') },
                        },
                        transparent: true,
                        cullFace: false,
                    });

                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    scene.rotation.y += 0.005;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
