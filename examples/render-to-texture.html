<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Render to texture</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Render to texture</div>
        <script type="module">
            import { Renderer, Camera, Texture, RenderTarget, Program, Mesh, Box } from '../src/index.js';

            const vertex = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let normal = normalize(input.vNormal);
                    let lighting = 0.2 * dot(normal, normalize(vec3f(-0.3, 0.8, 0.6)));
                    let tex = textureSample(tMap, tMapSampler, input.vUv).rgb;
                    let color = tex + lighting + vec3f(input.vUv - 0.5, 0.0) * 0.1;
                    return vec4f(color, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 1, 5);
                camera.lookAt([0, 0, 0]);

                const targetCamera = new Camera(renderer, { fov: 35 });
                targetCamera.position.set(0, 1, 5);
                targetCamera.lookAt([0, 0, 0]);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);

                    // Only update aspect of target camera, as first scene will be drawn to a square render target
                    targetCamera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const geometry = new Box(renderer);

                // A little data texture with 4 colors just to keep things interesting
                const texture = new Texture(renderer, {
                    image: new Uint8Array([191, 25, 54, 255, 96, 18, 54, 255, 96, 18, 54, 255, 37, 13, 53, 255]),
                    width: 2,
                    height: 2,
                    magFilter: 'nearest',
                });

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                });

                // Create render target framebuffer.
                const target = new RenderTarget(renderer, {
                    width: 512,
                    height: 512,
                });

                const targetProgram = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: target.texture },
                    },
                });

                const mesh = new Mesh(renderer, { geometry, program });
                const targetMesh = new Mesh(renderer, { geometry, program: targetProgram });

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    mesh.rotation.y -= 0.02;
                    targetMesh.rotation.y -= 0.005;
                    targetMesh.rotation.x -= 0.01;

                    // Set background for first render to target
                    renderer.clearColor = { r: 0.15, g: 0.05, b: 0.2, a: 1 };

                    // Add target property to render call
                    renderer.render({ scene: mesh, camera, target });

                    // Change to final background
                    renderer.clearColor = { r: 0, g: 0, b: 0, a: 1 };

                    // Omit target to render to canvas
                    renderer.render({ scene: targetMesh, camera: targetCamera });
                }
            }
        </script>
    </body>
</html>
