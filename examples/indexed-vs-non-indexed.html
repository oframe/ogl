<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Indexed vs Non-Indexed</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Indexed vs Non-Indexed</div>
        <script type="module">
            import { Renderer, Camera, Transform, Geometry, Program, Mesh } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let c = 0.5 + 0.3 * sin(vec3f(input.vUv.y, input.vUv.x, input.vUv.x) + material.uTime) + vec3f(0.2, 0.0, 0.1);
                    return vec4f(c, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create();
                document.body.appendChild(renderer.canvas);

                const camera = new Camera(renderer, { fov: 15 });
                camera.position.z = 15;

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                // 4 vertices, using 6 indices to designate 2 triangles using the default gl.TRIANGLES draw mode
                const indexedGeometry = new Geometry(renderer, {
                    position: {
                        size: 3,
                        data: new Float32Array([
                            -0.5,
                            0.5,
                            0, // vertex 0
                            -0.5,
                            -0.5,
                            0, // vertex 1
                            0.5,
                            0.5,
                            0, // vertex 2
                            0.5,
                            -0.5,
                            0, // vertex 3
                        ]),
                    },
                    uv: {
                        size: 2,
                        data: new Float32Array([
                            0,
                            1, // vertex 0
                            1,
                            1, // vertex 1
                            0,
                            0, // vertex 2
                            1,
                            0, // vertex 3
                        ]),
                    },

                    // the indices attribute must use the name 'index' to be treated as an index buffer
                    index: { data: new Uint16Array([0, 1, 2, 1, 3, 2]) },
                });

                // To recreate the same square using non-indexed geometry, 6 vertices need to be passed in, including 2 duplicates.
                // If only the original 4 vertices were supplied, only one triangle would be drawn.
                const nonIndexedGeometry = new Geometry(renderer, {
                    position: {
                        size: 3,
                        data: new Float32Array([
                            -0.5,
                            0.5,
                            0, // vertex 0
                            -0.5,
                            -0.5,
                            0, // vertex 1
                            0.5,
                            0.5,
                            0, // vertex 2
                            -0.5,
                            -0.5,
                            0, // vertex 1
                            0.5,
                            -0.5,
                            0, // vertex 3
                            0.5,
                            0.5,
                            0, // vertex 2
                        ]),
                    },
                    uv: {
                        size: 2,
                        data: new Float32Array([
                            0,
                            1, // vertex 0
                            1,
                            1, // vertex 1
                            0,
                            0, // vertex 2
                            1,
                            1, // vertex 1
                            1,
                            0, // vertex 3
                            0,
                            0, // vertex 2
                        ]),
                    },
                });

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                    },
                });

                const indexedMesh = new Mesh(renderer, { geometry: indexedGeometry, program });
                indexedMesh.setParent(scene);
                indexedMesh.position.y = 0.9;

                const nonIndexedMesh = new Mesh(renderer, { geometry: nonIndexedGeometry, program });
                nonIndexedMesh.setParent(scene);
                nonIndexedMesh.position.y = -0.9;

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    program.uniforms.uTime.value = t * 0.001;
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
