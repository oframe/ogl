<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Compressed Textures</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Compressed Textures.</div>
        <script type="module">
            import { Renderer, Camera, Transform, Program, Mesh, Plane, Orbit, TextureLoader } from '../src/index.js';

            const vertex = /* wgsl */ `
                @group(0) @binding(0) var tMapTex : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMapTex : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    return textureSample(tMapTex, tMapSampler, input.vUv * 2.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(-1, 0.5, 2);

                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                // Compressed textures use the KTXTexture (Khronos Texture) class
                // For generation, use https://github.com/TimvanScherpenzeel/texture-compressor

                // For a handy method that handles loading for you, use the TextureLoader.load() method.
                // Either pass a `src` string to load it (regardless of support)
                // const texture = TextureLoader.load(renderer, {
                //     src: 'assets/compressed/s3tc-m-y.ktx',
                // });

                // Or pass in an object of extension:src key-values, and the function will use the first
                // supported format in the list - so order by preference!
                const texture = TextureLoader.load(renderer, {
                    src: {
                        s3tc: 'assets/compressed/s3tc-m-y.ktx',
                        etc: 'assets/compressed/etc-m-y.ktx',
                        pvrtc: 'assets/compressed/pvrtc-m-y.ktx',
                        jpg: 'assets/compressed/uv.jpg',
                    },
                    wrapS: 'repeat',
                    wrapT: 'repeat',
                });
                // A console warning will show when no supported format was supplied

                // `loaded` property is a promise resolved when the file is loaded and processed
                // texture.loaded.then(() => console.log('loaded'));

                // You can check which format was applied using the `ext` property
                document.body.querySelector('.Info').textContent += ` Supported format chosen: '${texture.ext}'.`;

                const geometry = new Plane(renderer);

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                    cullFace: false,
                });

                const mesh = new Mesh(renderer, { geometry, program });
                mesh.setParent(scene);

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
