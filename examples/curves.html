<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Curves</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Curves</div>
        <script type="module">
            import { Renderer, Camera, Transform, Program, Mesh, Sphere, Polyline, Orbit, Vec3, Color, Curve } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vNormal : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct FragmentInput {
                    @location(0) vNormal : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    return vec4f(normalize(input.vNormal), 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 0, 5);

                // Create controls and pass parameters
                const controls = new Orbit(camera, {
                    target: new Vec3(0, 0, 0),
                });

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const sphereGeometry = new Sphere(renderer);

                const program = new Program(renderer, {
                    vertex,
                    fragment,

                    // Don't cull faces so that plane is double sided - default is gl.BACK
                    cullFace: false,
                });

                const sphere = new Mesh(renderer, { geometry: sphereGeometry, program });
                sphere.setParent(scene);

                const curve = new Curve({
                    points: [new Vec3(0, 0.5, 0), new Vec3(0, 1, 1), new Vec3(0, -1, 1), new Vec3(0, -0.5, 0)],
                    type: Curve.CUBICBEZIER,
                });
                const points = curve.getPoints(20);

                curve.type = Curve.CATMULLROM;
                const points2 = curve.getPoints(20);

                curve.type = Curve.QUADRATICBEZIER;
                const points3 = curve.getPoints(20);

                const polyline = new Polyline(renderer, {
                    points,
                    uniforms: {
                        uColor: { value: new Color('#f00') },
                        uThickness: { value: 3 },
                    },
                });

                const polyline2 = new Polyline(renderer, {
                    points: points2,
                    uniforms: {
                        uColor: { value: new Color('#00f') },
                        uThickness: { value: 2 },
                    },
                });

                const polyline3 = new Polyline(renderer, {
                    points: points3,
                    uniforms: {
                        uColor: { value: new Color('#0f0') },
                        uThickness: { value: 4 },
                    },
                });

                for (let i = 0; i <= 60; i++) {
                    const { geometry, program } = [polyline, polyline2, polyline3][i % 3];
                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(sphere);
                    mesh.rotation.y = (i * Math.PI) / 60;
                }

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    sphere.rotation.y -= 0.01;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
