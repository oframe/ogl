<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Point lighting with specular highlights</title>
        <link href="assets/main.css" rel="stylesheet" />
        <style>
            body {
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="Info">
            Point lighting with specular highlights. Texture by
            <a href="https://www.solarsystemscope.com/textures/" target="_blank">Solar System Scope</a>
        </div>
        <script type="module">
            import { Renderer, Camera, Vec3, Orbit, Sphere, Transform, Program, Mesh, Texture } from '../src/index.js';

            const VERTEX_SHADER = /* wgsl */ `
                struct MaterialUniforms {
                    u_dt : f32,
                    u_lightWorldPosition : vec3f,
                    u_shininess : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var colMap : texture_2d<f32>;
                @group(0) @binding(2) var colMapSampler : sampler;
                @group(0) @binding(3) var specMap : texture_2d<f32>;
                @group(0) @binding(4) var specMapSampler : sampler;
                @group(0) @binding(5) var cloudMap : texture_2d<f32>;
                @group(0) @binding(6) var cloudMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) v_normal : vec3f,
                    @location(1) v_surfaceToLight : vec3f,
                    @location(2) v_surfaceToView : vec3f,
                    @location(3) v_uv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;

                    // Pass UV information to Fragment Shader
                    output.v_uv = input.uv;

                    // Calculate World Space Normal
                    output.v_normal = object.normalMatrix * input.normal;

                    // Compute the world position of the surface
                    let surfaceWorldPosition = (object.modelMatrix * vec4f(input.position, 0.0)).xyz;

                    // Vector from the surface, to the light
                    output.v_surfaceToLight = material.u_lightWorldPosition - surfaceWorldPosition;

                    // Vector from the surface, to the camera
                    output.v_surfaceToView = object.cameraPosition - surfaceWorldPosition;

                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const FRAGMENT_SHADER = /* wgsl */ `
                struct MaterialUniforms {
                    u_dt : f32,
                    u_lightWorldPosition : vec3f,
                    u_shininess : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var colMap : texture_2d<f32>;
                @group(0) @binding(2) var colMapSampler : sampler;
                @group(0) @binding(3) var specMap : texture_2d<f32>;
                @group(0) @binding(4) var specMapSampler : sampler;
                @group(0) @binding(5) var cloudMap : texture_2d<f32>;
                @group(0) @binding(6) var cloudMapSampler : sampler;

                struct FragmentInput {
                    @location(0) v_normal : vec3f,
                    @location(1) v_surfaceToLight : vec3f,
                    @location(2) v_surfaceToView : vec3f,
                    @location(3) v_uv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {

                    // Re-normalize interpolated varyings
                    let normal = normalize(input.v_normal);
                    let surfaceToLightDirection = normalize(input.v_surfaceToLight);
                    let surfaceToViewDirection = normalize(input.v_surfaceToView);

                    // Calculate Half-Vector, Vector that bisects the angle of reflection.
                    // This vector indicates the "brightest point"; A "reference vector" if you will.
                    let halfVector = normalize(surfaceToLightDirection + surfaceToViewDirection);

                    // Then we can get the brightness at any point by seeing "how similar"
                    // the surface normal is to the reference vector.
                    let light = dot(normal, surfaceToLightDirection);

                    // By raising the specular vector to a power we can control the intensity
                    // of the light
                    var specular = 0.0;
                    if (light > 0.0) {
                        specular = pow(dot(normal, halfVector), material.u_shininess * 100.0);
                    }

                    // Mapping textures
                    let col = textureSample(colMap, colMapSampler, input.v_uv).rgb;
                    let spec = textureSample(specMap, specMapSampler, input.v_uv).rgb;

                    let cloudUV = vec2f(input.v_uv.x + material.u_dt, input.v_uv.y);
                    let cloud = textureSample(cloudMap, cloudMapSampler, cloudUV).rgb;

                    var color = col + cloud;

                    // Add Point Lighting
                    color *= light;

                    // Add Specular Highlights
                    color += specular * spec;

                    return vec4f(color, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create();
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 0.05, g: 0.05, b: 0.05, a: 1 };

                const camera = new Camera(renderer);
                camera.position.set(0, 0, 2);

                const controls = new Orbit(camera, {
                    target: new Vec3(0, 0, 0),
                });

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({
                        aspect: renderer.canvas.width / renderer.canvas.height,
                    });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();
                const geometry = new Sphere(renderer, { widthSegments: 64 });

                // Make A point Light
                const light = new Vec3(20, 30, 60);

                // Color Map
                const colMap = new Texture(renderer);
                const img = new Image();
                img.onload = () => (colMap.image = img);
                img.src = 'assets/earth.jpg';

                // Specular Map
                const specMap = new Texture(renderer);
                const specMap_img = new Image();
                specMap_img.onload = () => (specMap.image = specMap_img);
                specMap_img.src = 'assets/earth_specular.jpg';

                // Cloud Map
                const cloudMap = new Texture(renderer, { wrapS: 'repeat', wrapT: 'repeat' });
                const cloudMap_img = new Image();
                cloudMap_img.onload = () => (cloudMap.image = cloudMap_img);
                cloudMap_img.src = 'assets/earth_cloud.jpg';

                const program = new Program(renderer, {
                    vertex: VERTEX_SHADER,
                    fragment: FRAGMENT_SHADER,
                    uniforms: {
                        u_dt: { value: 0 },
                        u_lightWorldPosition: { value: light }, // Position of the Light
                        u_shininess: { value: 1.5 },
                        colMap: { value: colMap }, // Color Map
                        specMap: { value: specMap }, // Specular Map
                        cloudMap: { value: cloudMap }, // Cloud Map
                    },
                });

                const mesh = new Mesh(renderer, { geometry, program });
                mesh.setParent(scene);

                document.addEventListener('mousemove', (e) => {
                    const cords = {
                        x: e.x - window.innerWidth / 2,
                        y: e.y - window.innerHeight / 2,
                    };
                    program.uniforms.u_lightWorldPosition.value = [cords.x, -cords.y, 40];
                });

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    mesh.rotation.y += 0.005;

                    program.uniforms.u_dt.value = -t * 0.00002;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
