<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Triangle Screen Shader</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Triangle Screen Shader</div>
        <script type="module">
            import { Renderer, Program, Color, Mesh, Triangle } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uColor : vec3f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct VertexInput {
                    @location(0) position : vec2f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = vec4f(input.position, 0.0, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uColor : vec3f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let t = material.uTime;
                    let uv = input.vUv;
                    let c = 0.5 + 0.3 * cos(vec3f(uv.x, uv.y, uv.x) + t) + material.uColor;
                    return vec4f(c, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create();
                document.body.appendChild(renderer.canvas);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
                window.addEventListener('resize', resize, false);
                resize();

                const geometry = new Triangle(renderer);

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        uColor: { value: new Color(0.3, 0.2, 0.5) },
                    },
                });

                const mesh = new Mesh(renderer, { geometry, program });

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    program.uniforms.uTime.value = t * 0.001;

                    // Don't need a camera if camera uniforms aren't required
                    renderer.render({ scene: mesh });
                }
            }
        </script>
    </body>
</html>
