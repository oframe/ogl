<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Frustum Culling</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Frustum Culling. Model by Google Poly</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Geometry, Mesh, Vec3, Orbit, Cylinder, NormalProgram } from '../src/index.js';

            const vertex = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vMVPos : vec4f,
                    @location(2) vPos : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vPos = input.position;
                    output.vMVPos = object.modelViewMatrix * vec4f(input.position, 1.0);
                    output.position = object.projectionMatrix * output.vMVPos;
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMap : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vMVPos : vec4f,
                    @location(2) vPos : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    var tex = textureSample(tMap, tMapSampler, input.vUv).rgb;

                    let dist = length(input.vMVPos.xyz);
                    let fog = smoothstep(2.0, 15.0, dist);
                    tex = mix(tex, vec3f(1.0), fog * 0.8);
                    tex = mix(tex, vec3f(1.0), smoothstep(1.0, 0.0, input.vPos.y));

                    return vec4f(tex, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(6, 6, 12);

                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const texture = new Texture(renderer);
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/forest.jpg';

                const program = new Program(renderer, {
                    vertex: vertex,
                    fragment: fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                });

                // Add camera used for demonstrating frustum culling
                const frustumCamera = new Camera(renderer, {
                    fov: 65,
                    far: 10,
                });
                frustumCamera.target = new Vec3();

                const frustumTransform = new Transform();
                frustumTransform.setParent(scene);

                loadForest();
                addCameraShape();

                async function loadForest() {
                    const data = await (await fetch(`assets/forest.json`)).json();
                    const size = 20;
                    const num = size * size;

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                    });

                    for (let i = 0; i < num; i++) {
                        const mesh = new Mesh(renderer, { geometry, program });
                        mesh.setParent(scene);

                        mesh.position.set(((i % size) - size * 0.5) * 2, 0, (Math.floor(i / size) - size * 0.5) * 2);
                        mesh.position.y += Math.sin(mesh.position.x * 0.5) * Math.sin(mesh.position.z * 0.5) * 0.5;
                        mesh.rotation.y = Math.random() * Math.PI * 2;
                        mesh.scale.set(0.8 + Math.random() * 0.3);
                    }
                }

                function addCameraShape() {
                    const mesh = new Mesh(renderer, {
                        geometry: new Cylinder(renderer, {
                            radiusBottom: 0.2,
                            height: 0.7,
                            radialSegments: 4,
                            openEnded: true,
                        }),
                        program: new NormalProgram(renderer),
                    });
                    mesh.program.cullFace = false;

                    mesh.setParent(frustumTransform);
                    mesh.isCameraShape = true;

                    mesh.rotation.reorder('XYZ');
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.rotation.y = Math.PI / 4;
                }

                function cameraPath(vec, time, y) {
                    const x = 4 * Math.sin(time);
                    const z = 2 * Math.sin(time * 2);
                    vec.set(x, y, z);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    // Move camera around a path
                    cameraPath(frustumCamera.position, t * 0.001, 2);
                    cameraPath(frustumCamera.target, t * 0.001 + 1, 1);
                    frustumCamera.lookAt(frustumCamera.target);
                    frustumCamera.updateMatrixWorld();
                    frustumCamera.updateFrustum();

                    frustumTransform.position.copy(frustumCamera.position);
                    frustumTransform.rotation.copy(frustumCamera.rotation);

                    // Traverse all meshes in the scene
                    scene.traverse((node) => {
                        if (!node.draw) return;
                        if (node.isCameraShape) return;

                        // perform the frustum test using the demo camera
                        node.visible = frustumCamera.frustumIntersectsMesh(node);
                    });

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
