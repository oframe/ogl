<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Particles</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Particles</div>
        <script type="module">
            import { Renderer, Camera, Geometry, Program, Mesh } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    _pad0 : f32,
                    uResolution : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) offset : vec3f,
                    @location(3) random : vec4f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vRandom : vec4f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vRandom = input.random;

                    // positions are 0->1, so make -1->1
                    var pos = input.offset * 2.0 - 1.0;

                    // Scale towards camera to be more interesting
                    pos.z *= 10.0;

                    // modelMatrix is one of the automatically attached uniforms
                    var mPos = object.modelMatrix * vec4f(pos, 1.0);

                    // add some movement in world space
                    let t = material.uTime * 0.6;
                    mPos.x += sin(t * input.random.z + 6.28 * input.random.w) * mix(0.1, 1.5, input.random.x);
                    mPos.y += sin(t * input.random.y + 6.28 * input.random.x) * mix(0.1, 1.5, input.random.w);
                    mPos.z += sin(t * input.random.w + 6.28 * input.random.y) * mix(0.1, 1.5, input.random.z);

                    // get the model view position so that we can scale the points off into the distance
                    var mvPos = object.viewMatrix * mPos;

                    // gl_PointSize equivalent (in pixels)
                    let pointSize = 300.0 / length(mvPos.xyz) * (input.random.x + 0.1);

                    // Convert pixel size to view-space units and expand quad (billboard)
                    let pixelToView = 2.0 / (material.uResolution.y * object.projectionMatrix[1][1]);
                    mvPos += vec4f(input.position.xy * pointSize * pixelToView, 0.0, 0.0);

                    output.position = object.projectionMatrix * mvPos;
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    _pad0 : f32,
                    uResolution : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vRandom : vec4f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let uv = input.vUv;

                    let circle = smoothstep(0.5, 0.4, length(uv - 0.5)) * 0.8;

                    var color = 0.8 + 0.2 * sin(vec3f(uv.y, uv.x, uv.x) + material.uTime + input.vRandom.y * 6.28) + vec3f(0.1, 0.0, 0.3);

                    return vec4f(color, circle);
                }
            `;

            {
                const renderer = await Renderer.create({ depth: false });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 15 });
                camera.position.z = 15;

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                    program.uniforms.uResolution.value[0] = renderer.canvas.width;
                    program.uniforms.uResolution.value[1] = renderer.canvas.height;
                }
                window.addEventListener('resize', resize, false);

                // Quad vertices (2 triangles making a square from -0.5 to 0.5)
                const quadPosition = new Float32Array([
                    -0.5, -0.5, 0,
                     0.5, -0.5, 0,
                     0.5,  0.5, 0,
                    -0.5,  0.5, 0,
                ]);
                const quadUv = new Float32Array([
                    0, 0,
                    1, 0,
                    1, 1,
                    0, 1,
                ]);
                const quadIndex = new Uint16Array([0, 1, 2, 0, 2, 3]);

                // Instance data
                const num = 100;
                const offset = new Float32Array(num * 3);
                const random = new Float32Array(num * 4);

                for (let i = 0; i < num; i++) {
                    offset.set([Math.random(), Math.random(), Math.random()], i * 3);
                    random.set([Math.random(), Math.random(), Math.random(), Math.random()], i * 4);
                }

                const geometry = new Geometry(renderer, {
                    position: { size: 3, data: quadPosition },
                    uv: { size: 2, data: quadUv },
                    index: { data: quadIndex },
                    offset: { instanced: 1, size: 3, data: offset },
                    random: { instanced: 1, size: 4, data: random },
                });

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        uResolution: { value: new Float32Array([renderer.canvas.width, renderer.canvas.height]) },
                    },
                    transparent: true,
                    depthTest: false,
                });

                const particles = new Mesh(renderer, { geometry, program });
                resize();

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    // add some slight overall movement to be more interesting
                    particles.rotation.x = Math.sin(t * 0.0002) * 0.1;
                    particles.rotation.y = Math.cos(t * 0.0005) * 0.15;
                    particles.rotation.z += 0.01;

                    program.uniforms.uTime.value = t * 0.001;
                    renderer.render({ scene: particles, camera });
                }
            }
        </script>
    </body>
</html>
