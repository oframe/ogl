<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Performance - High mesh count</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Performance - High mesh count</div>
        <div class="Info" style="padding-top: 0">
            <input id="meshCountInput" style="width: 100px"></input>
            <button  id="meshCountButton" style="padding:2px; border: 1px solid #000; background-color:#fff;" onclick="setMeshCount(document.getElementById('meshCountInput').value)">Set mesh count</button>
        </div>
        <script type="module">
            import { Renderer, Camera, Transform, Program, Mesh, Box } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vNormal : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct FragmentInput {
                    @location(0) vNormal : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let normal = normalize(input.vNormal);
                    let lighting = dot(normal, normalize(vec3f(-0.3, 0.8, 0.6)));
                    let color = vec3f(0.2, 0.8, 1.0) + lighting * 0.1;
                    return vec4f(color, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create();
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35, far: 3000 });

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                // Create base geometry
                const cubeGeometry = new Box(renderer);

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                });

                // mesh container
                let meshes = [];

                window.setMeshCount = function setMeshCount(count) {
                    // sanitize input
                    count = parseInt(count) || 1000;

                    // remove old meshes
                    for (let i = 0; i < meshes.length; ++i) scene.removeChild(meshes[i]);
                    meshes = [];

                    // create our meshes according to input
                    for (let i = 0; i < count; ++i) {
                        let mesh = new Mesh(renderer, { geometry: cubeGeometry, program });

                        // position meshes in a random position between -100 / +100 in each dimension
                        mesh.position.set(
                            -100 + Math.random() * 200,
                            -100 + Math.random() * 200,
                            -100 + Math.random() * 200
                        );
                        mesh.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
                        scene.addChild(mesh);
                        meshes.push(mesh);
                    }

                    // set input counter value to make sure
                    document.getElementById('meshCountInput').value = count;
                };

                setMeshCount(1000);

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    // rotate camera
                    let time = performance.now() / 30000;
                    camera.position.set(Math.sin(time) * 180, 80, Math.cos(time) * 180);
                    camera.lookAt([0, 0, 0]);

                    // rotate meshes
                    for (let i = 0; i < meshes.length; ++i) {
                        meshes[i].rotation.x += 0.01;
                        meshes[i].rotation.y += 0.01;
                    }

                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
