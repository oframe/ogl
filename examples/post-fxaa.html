<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Post FXAA (Fast Approximate Anti-Aliasing)</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Post FXAA (Fast Approximate Anti-Aliasing)</div>
        <script type="module">
            import { Renderer, Camera, Mesh, Vec2, Post, Box, NormalProgram } from '../src/index.js';

            // FXAA fragment shader (WGSL)
            // Uniform layout: binding 0 = uniform buffer (uResolution), binding 1 = texture (tMap), binding 2 = sampler
            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uResolution : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMapTex : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                fn fxaa(tex : texture_2d<f32>, smp : sampler, uv : vec2f, resolution : vec2f) -> vec4f {
                    let pixel = vec2f(1.0) / resolution;

                    let l = vec3f(0.299, 0.587, 0.114);
                    let lNW = dot(textureSample(tex, smp, uv + vec2f(-1.0, -1.0) * pixel).rgb, l);
                    let lNE = dot(textureSample(tex, smp, uv + vec2f(1.0, -1.0) * pixel).rgb, l);
                    let lSW = dot(textureSample(tex, smp, uv + vec2f(-1.0, 1.0) * pixel).rgb, l);
                    let lSE = dot(textureSample(tex, smp, uv + vec2f(1.0, 1.0) * pixel).rgb, l);
                    let lM = dot(textureSample(tex, smp, uv).rgb, l);
                    let lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
                    let lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));

                    var dir = vec2f(
                        -((lNW + lNE) - (lSW + lSE)),
                        ((lNW + lSW) - (lNE + lSE))
                    );
                    let dirReduce = max((lNW + lNE + lSW + lSE) * 0.03125, 0.0078125);
                    let rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
                    dir = min(vec2f(8.0), max(vec2f(-8.0), dir * rcpDirMin)) * pixel;

                    let rgbA = 0.5 * (
                        textureSample(tex, smp, uv + dir * (1.0 / 3.0 - 0.5)).rgb +
                        textureSample(tex, smp, uv + dir * (2.0 / 3.0 - 0.5)).rgb);
                    let rgbB = rgbA * 0.5 + 0.25 * (
                        textureSample(tex, smp, uv + dir * -0.5).rgb +
                        textureSample(tex, smp, uv + dir * 0.5).rgb);
                    let lB = dot(rgbB, l);

                    return mix(vec4f(rgbB, 1.0), vec4f(rgbA, 1.0),
                        max(sign(lB - lMin), 0.0) * max(sign(lB - lMax), 0.0));
                }

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let raw = textureSample(tMapTex, tMapSampler, input.vUv);
                    let aa = fxaa(tMapTex, tMapSampler, input.vUv, material.uResolution);

                    // Split screen in half to show side-by-side comparison
                    var color = mix(raw, aa, step(0.5, input.vUv.x));

                    // Darken left side a tad for clarity
                    color -= vec4f(vec3f(step(input.vUv.x, 0.5) * 0.1), 0.0);
                    return color;
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 1 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 1, 5);
                camera.lookAt([0, 0, 0]);

                // Post copies the current renderer values (width, height, dpr) if none are passed in
                const post = new Post(renderer);

                // Create uniform for pass
                const resolution = { value: new Vec2() };

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });

                    // Need to resize post as render targets need to be re-created
                    post.resize();
                    resolution.value.set(renderer.canvas.width, renderer.canvas.height);
                }
                window.addEventListener('resize', resize, false);
                resize();

                const geometry = new Box(renderer);
                const mesh = new Mesh(renderer, { geometry, program: new NormalProgram(renderer) });

                // Add pass like you're creating a Program. Then use the 'enabled'
                // property to toggle the pass.
                const pass = post.addPass({
                    // If not passed in, pass will use the default vertex/fragment
                    // shaders found within the class.
                    fragment,
                    uniforms: {
                        uResolution: resolution,
                    },
                });

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    mesh.rotation.y -= 0.005;
                    mesh.rotation.x -= 0.01;

                    // Replace Renderer.render with post.render. Use the same arguments.
                    post.render({ scene: mesh, camera });
                }
            }
        </script>
    </body>
</html>
