<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Wireframe Shader</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Wireframe Shader. Model by Google Poly</div>
        <script type="module">
            import { Renderer, Camera, Transform, Program, Geometry, Mesh, Vec3, Orbit } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                    @location(3) barycentric : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vBarycentric : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vBarycentric = input.barycentric;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct FragmentInput {
                    @location(0) vBarycentric : vec3f,
                    @builtin(front_facing) frontFacing : bool,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let bary = input.vBarycentric;

                    var color = vec3f(0.0);
                    var alpha = 1.0;

                    // Line thickness - in pixels
                    let width = 1.0 * 0.5;
                    let d = fwidth(bary);
                    let s = smoothstep(d * (width + 0.5), d * (width - 0.5), bary);
                    alpha *= max(max(s.x, s.y), s.z);

                    // Dashes
                    alpha *= step(0.0, sin(max(bary.x, bary.y) * 3.14 * 5.0));

                    // Back face shading
                    let ff = select(0.0, 1.0, input.frontFacing);
                    color = mix(vec3f(1.0, 0.0, 0.0), color, vec3f(ff));
                    alpha = mix(alpha * 0.1 + 0.02, alpha, ff);

                    return vec4f(color, alpha);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(3, 2, 4);

                const controls = new Orbit(camera, {
                    target: new Vec3(0, 1, 0),
                });

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    transparent: true,
                    cullFace: false,
                    depthTest: false,
                });

                function addBarycentric(position) {
                    const count = position.length / 9;
                    const barycentric = [];

                    for (let i = 0; i < count; i++) {
                        if (i % 2 === 0) barycentric.push(0, 0, 1, 0, 1, 0, 1, 0, 0);
                        else barycentric.push(0, 1, 0, 0, 0, 1, 1, 0, 0);
                    }

                    return new Float32Array(barycentric);
                }

                let mesh;
                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/goat.json`)).json();

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                        barycentric: { size: 3, data: addBarycentric(data.position) },
                    });

                    mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    if (mesh) mesh.rotation.y += 0.005;
                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
