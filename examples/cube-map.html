<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Cube Map</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">
            Cube Map. Texture by <a href="http://www.humus.name" target="_blank">Humus</a>
            <div id="dropdown">
                <label for="zoom-style">Zoom Style:</label>
                <select name="zoom-style" id="zoom-style">
                    <option value="dolly">Dolly</option>
                    <option value="fov">FOV</option>
                </select>
            </div>
        </div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Mesh, Box, Orbit } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };
                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vDir : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vDir = normalize(input.position);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMapTex : texture_cube<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vDir : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMapTex, tMapSampler, input.vDir).rgb;
                    return vec4f(tex, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(-2, 1, -3);

                const controls = new Orbit(camera);

                document.querySelector('#dropdown').addEventListener('change', ({ target: { value } }) => {
                    controls.zoomStyle = value;
                });

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                // Create an empty cube map texture
                const texture = new Texture(renderer, {
                    target: 'cube',
                });

                loadImages();
                async function loadImages() {
                    function loadImage(src) {
                        return new Promise((res) => {
                            const img = new Image();
                            img.onload = () => res(img);
                            img.src = src;
                        });
                    }

                    // Must be in this order:
                    // +X Right, -X Left, +Y Top, -Y Bottom, +Z Back, -Z Front
                    const images = await Promise.all([
                        loadImage('assets/cube/posx.jpg'),
                        loadImage('assets/cube/negx.jpg'),
                        loadImage('assets/cube/posy.jpg'),
                        loadImage('assets/cube/negy.jpg'),
                        loadImage('assets/cube/posz.jpg'),
                        loadImage('assets/cube/negz.jpg'),
                    ]);

                    // Once all are loaded, we can update the texture image, which will upload them
                    texture.image = images;
                }

                const geometry = new Box(renderer);

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                    cullFace: false,
                });

                const skybox = new Mesh(renderer, { geometry, program });
                skybox.setParent(scene);
                skybox.scale.set(20);

                const mesh = new Mesh(renderer, { geometry, program });
                mesh.setParent(scene);

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    mesh.rotation.y += 0.003;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
