<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Instancing</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Instancing with GPU Picking</div>
        <script type="module">
            import { Renderer, Camera, RenderTarget, Vec3, Transform, Program, Box, Mesh, NormalProgram } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uTargetRender : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                    @location(3) offset : vec3f,
                    @location(4) random : vec3f,
                    @location(5) id : vec4f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vId : vec4f,
                };

                fn rotate2d(v : vec2f, a : f32) -> vec2f {
                    let m = mat2x2f(cos(a), -sin(a), sin(a), cos(a));
                    return m * v;
                }

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vId = input.id;
                    output.vNormal = input.normal;

                    // copy position so that we can modify the instances
                    var pos = input.position;

                    // scale first
                    pos *= 0.9 + input.random.y * 0.2;

                    // rotate around y axis
                    let rotated = rotate2d(pos.xz, input.random.x * 6.28 + 4.0 * material.uTime * (input.random.y - 0.5));
                    pos = vec3f(rotated.x, pos.y, rotated.y);

                    pos += input.offset;

                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(pos, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uTargetRender : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vId : vec4f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    if (material.uTargetRender > 0.5) {
                        return input.vId;
                    }
                    let normal = normalize(input.vNormal);
                    let lighting = dot(normal, normalize(vec3f(-0.3, 0.8, 0.6)));
                    return vec4f(vec3f(0.2, 0.8, 1.0) + lighting * 0.1, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 15 });
                camera.position.z = 15;

                let target;

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                    // Create pick render target at canvas pixel dimensions
                    target = new RenderTarget(renderer, {
                        width: renderer.canvas.width,
                        height: renderer.canvas.height,
                    });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const num = 20;

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        uTargetRender: { value: 0 },
                    },
                });

                let mesh, highlight;
                let objects = [];
                {
                    let offsetData = new Float32Array(num * 3);
                    let randomData = new Float32Array(num * 3);
                    let idData = new Float32Array(num * 4);
                    for (let i = 0; i < num; i++) {
                        const offset = [Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1];
                        offsetData.set(offset, i * 3);

                        let id = i + 1;
                        idData.set(
                            [((id >> 0) & 0xff) / 0xff, ((id >> 8) & 0xff) / 0xff, ((id >> 16) & 0xff) / 0xff, ((id >> 24) & 0xff) / 0xff],
                            i * 4
                        );

                        const random = [Math.random(), Math.random(), Math.random()];
                        randomData.set(random, i * 3);

                        objects.push({ id, offset, random });
                    }

                    const geometry = new Box(renderer, {
                        width: 0.2,
                        height: 0.2,
                        depth: 0.2,
                    });
                    // Add instanced attributes after Box creation so that
                    // built-in attributes (position=0, normal=1, uv=2) get
                    // lower slot indices, matching the shader @location layout.
                    geometry.addAttribute('offset', { instanced: 1, size: 3, data: offsetData });
                    geometry.addAttribute('random', { instanced: 1, size: 3, data: randomData });
                    // Add id data. This way we can recognize the instance later.
                    geometry.addAttribute('id', { instanced: 1, size: 4, data: idData });

                    mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);

                    // Create a separate non-instanced geometry for the highlight
                    // (sharing the instanced geometry would draw 20 overlapping instances)
                    const highlightGeometry = new Box(renderer, {
                        width: 0.2,
                        height: 0.2,
                        depth: 0.2,
                    });
                    highlight = new Mesh(renderer, { geometry: highlightGeometry, program: new NormalProgram(renderer) });
                    highlight.setParent(scene);
                    highlight.visible = false;
                }

                // Wrap in load event to prevent checks before page is ready
                window.addEventListener(
                    'load',
                    () => {
                        document.addEventListener('mousemove', move, false);
                        document.addEventListener('touchmove', move, false);
                    },
                    false
                );

                const mouse = new Vec3();
                function move(e) {
                    // Map mouse coordinates to the pick render target pixel space
                    // WebGPU textures have y=0 at top, same as mouse events — no Y flip needed
                    const mx = Math.floor((e.x * target.width) / renderer.canvas.clientWidth);
                    const my = Math.floor((e.y * target.height) / renderer.canvas.clientHeight);
                    mouse.set(mx, my);
                }

                // Non-blocking async picking pattern for WebGPU
                let pickPending = false;
                let highlightedId = -1;

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    if (!mesh) return;

                    let time = t * 0.001;
                    program.uniforms.uTime.value = time;

                    // Only start a new pick if previous one is done
                    if (!pickPending) {
                        pickPending = true;

                        // Render ids to pick render target
                        mesh.program.uniforms.uTargetRender.value = 1;
                        renderer.render({ scene: mesh, camera, target });

                        // Async read pixel at mouse position
                        target.readPixel(mouse.x, mouse.y).then((data) => {
                            // Transform color back to id
                            const id = data[0] + (data[1] << 8) + (data[2] << 16) + (data[3] << 24);
                            highlightedId = (id >= 1 && id <= num) ? id : -1;
                            pickPending = false;
                        });
                    }

                    // Update highlight transform every frame to stay in sync with shader rotation
                    if (highlightedId >= 1) {
                        let obj = objects[highlightedId - 1];
                        let [rx, ry, rz] = obj.random;
                        highlight.scale.set(0.9 + ry * 0.2).scale(1.005);
                        highlight.rotation.set(0);
                        highlight.rotation.y = rx * 6.28 + 4 * time * (ry - 0.5);
                        highlight.position.set(obj.offset);
                        highlight.visible = true;
                    } else {
                        highlight.visible = false;
                    }

                    // Render visible scene
                    mesh.program.uniforms.uTargetRender.value = 0;
                    program.uniforms.uTime.value = time;
                    renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
