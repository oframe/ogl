<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Post Bloom Effect</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info" style="color: #fff">Post Bloom Effect</div>
        <script type="module">
            import { Renderer, Camera, Program, Mesh, Vec2, Post, Box, Transform } from '../src/index.js';

            // Bright pass - filter the scene to only the bright parts
            // Uniforms: uThreshold (f32) + tMap (texture)
            // Bindings: 0 = uniform buffer, 1 = texture, 2 = sampler
            const brightPassFragment = /* wgsl */ `
                struct MaterialUniforms {
                    uThreshold : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMapTex : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMapTex, tMapSampler, input.vUv);
                    let bright = tex * step(material.uThreshold, length(tex.rgb) / 1.73205);
                    return bright;
                }
            `;

            // Gaussian blur pass
            // Uniforms: uResolution (vec2f) + uDirection (vec2f) + tMap (texture)
            // Bindings: 0 = uniform buffer, 1 = texture, 2 = sampler
            const blurFragment = /* wgsl */ `
                struct MaterialUniforms {
                    uResolution : vec2f,
                    uDirection : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMapTex : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                // https://github.com/Jam3/glsl-fast-gaussian-blur/blob/master/5.glsl
                fn blur5(tex : texture_2d<f32>, smp : sampler, uv : vec2f, resolution : vec2f, direction : vec2f) -> vec4f {
                    var color = vec4f(0.0);
                    let off1 = vec2f(1.3333333333333333) * direction;
                    color += textureSample(tex, smp, uv) * 0.29411764705882354;
                    color += textureSample(tex, smp, uv + (off1 / resolution)) * 0.35294117647058826;
                    color += textureSample(tex, smp, uv - (off1 / resolution)) * 0.35294117647058826;
                    return color;
                }

                // https://github.com/Jam3/glsl-fast-gaussian-blur/blob/master/9.glsl
                fn blur9(tex : texture_2d<f32>, smp : sampler, uv : vec2f, resolution : vec2f, direction : vec2f) -> vec4f {
                    var color = vec4f(0.0);
                    let off1 = vec2f(1.3846153846) * direction;
                    let off2 = vec2f(3.2307692308) * direction;
                    color += textureSample(tex, smp, uv) * 0.2270270270;
                    color += textureSample(tex, smp, uv + (off1 / resolution)) * 0.3162162162;
                    color += textureSample(tex, smp, uv - (off1 / resolution)) * 0.3162162162;
                    color += textureSample(tex, smp, uv + (off2 / resolution)) * 0.0702702703;
                    color += textureSample(tex, smp, uv - (off2 / resolution)) * 0.0702702703;
                    return color;
                }

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    // Swap with blur9 for higher quality
                    // return blur9(tMapTex, tMapSampler, input.vUv, material.uResolution, material.uDirection);
                    return blur5(tMapTex, tMapSampler, input.vUv, material.uResolution, material.uDirection);
                }
            `;

            // Composite pass - combine scene with bloom
            // Uniforms: uResolution (vec2f) + uBloomStrength (f32) + tBloom (texture) + tMap (texture)
            // Bindings: 0 = uniform buffer, 1 = tBloom texture, 2 = tBloom sampler, 3 = tMap texture, 4 = tMap sampler
            const compositeFragment = /* wgsl */ `
                struct MaterialUniforms {
                    uResolution : vec2f,
                    uBloomStrength : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tBloomTex : texture_2d<f32>;
                @group(0) @binding(2) var tBloomSampler : sampler;
                @group(0) @binding(3) var tMapTex : texture_2d<f32>;
                @group(0) @binding(4) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    return textureSample(tMapTex, tMapSampler, input.vUv) + textureSample(tBloomTex, tBloomSampler, input.vUv) * material.uBloomStrength;
                }
            `;

            // Scene vertex shader - standard object UBO transform
            const sceneVertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            // Scene fragment shader - simple UV-based coloring
            const sceneFragment = /* wgsl */ `
                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    return vec4f(input.vUv, 1.0, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 1 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 0.0, g: 0.0, b: 0.1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 1, 5);
                camera.lookAt([0, 0, 0]);

                // Create composite post at full resolution, and bloom at reduced resolution
                const postComposite = new Post(renderer);
                // `targetOnly: true` prevents post from rendering to canvas
                const postBloom = new Post(renderer, { dpr: 0.5, targetOnly: true });

                // Create uniforms for passes
                const resolution = { value: new Vec2() };
                const bloomResolution = { value: new Vec2() };

                const scene = new Transform();

                let mesh;
                // Store this so we can toggle it on and off during render phase
                let compositePass;

                {
                    initScene();
                    initPasses();
                }

                function initScene() {
                    const geometry = new Box(renderer);
                    const program = new Program(renderer, {
                        vertex: sceneVertex,
                        fragment: sceneFragment,
                    });
                    mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                function initPasses() {
                    // Add Bright pass - filter the scene to only the bright parts we want to blur
                    const brightPass = postBloom.addPass({
                        fragment: brightPassFragment,
                        uniforms: {
                            uThreshold: { value: 0.8 },
                        },
                    });
                    // Add gaussian blur passes
                    const horizontalPass = postBloom.addPass({
                        fragment: blurFragment,
                        uniforms: {
                            uResolution: bloomResolution,
                            uDirection: { value: new Vec2(2, 0) },
                        },
                    });
                    const verticalPass = postBloom.addPass({
                        fragment: blurFragment,
                        uniforms: {
                            uResolution: bloomResolution,
                            uDirection: { value: new Vec2(0, 2) },
                        },
                    });
                    // Re-add the gaussian blur passes several times to the array to get smoother results
                    for (let i = 0; i < 5; i++) {
                        postBloom.passes.push(horizontalPass, verticalPass);
                    }

                    // Add final composite pass
                    compositePass = postComposite.addPass({
                        fragment: compositeFragment,
                        uniforms: {
                            uResolution: resolution,
                            tBloom: postBloom.uniform,
                            uBloomStrength: { value: 1.0 },
                        },
                    });
                }

                function resize() {
                    const { innerWidth: width, innerHeight: height } = window;
                    renderer.setSize(width, height);
                    camera.perspective({ aspect: width / height });

                    // Update post classes
                    postComposite.resize();
                    postBloom.resize();

                    // Update uniforms
                    resolution.value.set(width, height);
                    bloomResolution.value.set(postBloom.resolutionWidth, postBloom.resolutionHeight);
                }

                window.addEventListener('resize', resize, false);
                resize();

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    mesh.rotation.y -= 0.005;
                    mesh.rotation.x -= 0.01;

                    // Disable compositePass pass, so this post will just render the scene for now
                    compositePass.enabled = false;
                    // `targetOnly` prevents post from rendering to the canvas
                    postComposite.targetOnly = true;
                    // This renders the scene to postComposite.uniform.value
                    postComposite.render({ scene, camera });

                    // This render the bloom effect's bright and blur passes to postBloom.fbo.read
                    // Passing in a `texture` argument avoids the post initially rendering the scene
                    postBloom.render({ texture: postComposite.uniform.value });

                    // Re-enable composite pass
                    compositePass.enabled = true;
                    // Allow post to render to canvas upon its last pass
                    postComposite.targetOnly = false;

                    // This renders to canvas, compositing the bloom pass on top
                    // pass back in its previous render of the scene to avoid re-rendering
                    postComposite.render({ texture: postComposite.uniform.value });
                }
            }
        </script>
    </body>
</html>
