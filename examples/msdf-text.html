<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • MSDF Text Glyphs (Multichannel Signed Distance Fields)</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">MSDF Text Glyphs (Multichannel Signed Distance Fields)</div>
        <script type="module">
            import { Renderer, Camera, Transform, Geometry, Texture, Program, Mesh, Orbit, Text } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };
                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMapTex : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMapTex, tMapSampler, input.vUv).rgb;
                    let signedDist = max(min(tex.r, tex.g), min(max(tex.r, tex.g), tex.b)) - 0.5;
                    let d = fwidth(signedDist);
                    let alpha = smoothstep(-d, d, signedDist);

                    if (alpha < 0.01) { discard; }

                    return vec4f(0.0, 0.0, 0.0, alpha);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(0, 0, 7);

                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                /*

                Instructions to generate necessary MSDF assets

                Install msdf-bmfont https://github.com/soimy/msdf-bmfont-xml
                `npm install msdf-bmfont-xml -g`

                Then, using a font .ttf file, run the following (using 'FiraSans-Bold.ttf' as example)

                `msdf-bmfont -f json -m 512,512 -d 2 --pot --smart-size FiraSans-Bold.ttf`

                Outputs a .png bitmap spritesheet and a .json with character parameters.

                */

                const texture = new Texture(renderer, {
                    generateMipmaps: false,
                });
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/fonts/FiraSans-Bold.png';

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                    },
                    transparent: true,
                    cullFace: false,
                    depthWrite: false,
                });

                loadText();
                async function loadText() {
                    const font = await (await fetch('assets/fonts/FiraSans-Bold.json')).json();

                    const text = new Text({
                        font,
                        text: "don't panic",
                        width: 4,
                        align: 'center',
                        letterSpacing: -0.05,
                        size: 1,
                        lineHeight: 1.1,
                    });

                    // Pass the generated buffers into a geometry
                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: text.buffers.position },
                        uv: { size: 2, data: text.buffers.uv },
                        // id provides a per-character index, for effects that may require it
                        id: { size: 1, data: text.buffers.id },
                        index: { data: text.buffers.index },
                    });

                    const mesh = new Mesh(renderer, { geometry, program });

                    // Use the height value to position text vertically. Here it is centered.
                    mesh.position.y = text.height * 0.5;
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
