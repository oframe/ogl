<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Mouse Flowmap</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">
            Mouse Flowmap. Texture by
            <a href="https://www.deviantart.com/berserkitty/art/Seamless-Cartoon-styled-Water-Texture-743787929" target="_blank">BerserKitty</a>
        </div>
        <script type="module">
            import { Renderer, Program, Texture, Mesh, Vec2, Flowmap, Triangle } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct VertexInput {
                    @location(0) position : vec2f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = vec4f(input.position, 0.0, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tWaterTex : texture_2d<f32>;
                @group(0) @binding(2) var tWaterSampler : sampler;
                @group(0) @binding(3) var tFlowTex : texture_2d<f32>;
                @group(0) @binding(4) var tFlowSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput, @builtin(position) fragCoord : vec4f) -> @location(0) vec4f {
                    // R and G values are velocity in the x and y direction
                    // B value is the velocity length
                    let flow = textureSample(tFlowTex, tFlowSampler, vec2f(input.vUv.x, 1.0 - input.vUv.y)).rgb;

                    // Use flow to adjust the uv lookup of a texture
                    var uv = fragCoord.xy / 600.0;
                    uv += flow.xy * 0.05;
                    var tex = textureSample(tWaterTex, tWaterSampler, uv).rgb;

                    // Oscillate between raw values and the affected texture above
                    tex = mix(tex, flow * 0.5 + 0.5, smoothstep(-0.3, 0.7, sin(material.uTime)));

                    return vec4f(tex, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);

                // Variable inputs to control flowmap
                let aspect = 1;
                const mouse = new Vec2(-1);
                const velocity = new Vec2();

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    aspect = window.innerWidth / window.innerHeight;
                }
                window.addEventListener('resize', resize, false);
                resize();

                const flowmap = new Flowmap(renderer);

                // Triangle that includes -1 to 1 range for 'position', and 0 to 1 range for 'uv'.
                const geometry = new Triangle(renderer);

                const texture = new Texture(renderer, { wrapS: 'repeat', wrapT: 'repeat' });
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/water.jpg';

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        tWater: { value: texture },

                        // Note that the uniform is applied without using an object and value property
                        // This is because the class alternates this texture between two render targets
                        // and updates the value property after each render.
                        tFlow: flowmap.uniform,
                    },
                });

                const mesh = new Mesh(renderer, { geometry, program });

                // Create handlers to get mouse position and velocity
                const isTouchCapable = 'ontouchstart' in window;
                if (isTouchCapable) {
                    window.addEventListener('touchstart', updateMouse, false);
                    window.addEventListener('touchmove', updateMouse, false);
                } else {
                    window.addEventListener('mousemove', updateMouse, false);
                }

                let lastTime;
                const lastMouse = new Vec2();
                function updateMouse(e) {
                    if (e.changedTouches && e.changedTouches.length) {
                        e.x = e.changedTouches[0].pageX;
                        e.y = e.changedTouches[0].pageY;
                    }
                    if (e.x === undefined) {
                        e.x = e.pageX;
                        e.y = e.pageY;
                    }

                    // Get mouse value in 0 to 1 range, with y flipped
                    mouse.set(e.x / renderer.width, 1 - e.y / renderer.height);

                    // Calculate velocity
                    if (!lastTime) {
                        // First frame
                        lastTime = performance.now();
                        lastMouse.set(e.x, e.y);
                    }

                    const deltaX = e.x - lastMouse.x;
                    const deltaY = e.y - lastMouse.y;

                    lastMouse.set(e.x, e.y);

                    let time = performance.now();

                    // Avoid dividing by 0
                    let delta = Math.max(14, time - lastTime);
                    lastTime = time;

                    velocity.x = deltaX / delta;
                    velocity.y = deltaY / delta;

                    // Flag update to prevent hanging velocity values when not moving
                    velocity.needsUpdate = true;
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    // Reset velocity when mouse not moving
                    if (!velocity.needsUpdate) {
                        mouse.set(-1);
                        velocity.set(0);
                    }
                    velocity.needsUpdate = false;

                    // Update flowmap inputs
                    flowmap.aspect = aspect;
                    flowmap.mouse.copy(mouse);

                    // Ease velocity input, slower when fading out
                    flowmap.velocity.lerp(velocity, velocity.len() ? 0.5 : 0.1);

                    flowmap.update();

                    program.uniforms.uTime.value = t * 0.001;

                    renderer.render({ scene: mesh });
                }
            }
        </script>
    </body>
</html>
