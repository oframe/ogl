<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Fog</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Fog. Model by Google Poly</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Color, Geometry, Mesh } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uFogColor : vec3f,
                    uFogNear : f32,
                    uFogFar : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMap : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) offset : vec3f,
                    @location(3) random : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vMVPos : vec4f,
                    @location(2) vPos : vec3f,
                };

                fn rotate2d(v : vec2f, a : f32) -> vec2f {
                    let m = mat2x2f(cos(a), -sin(a), sin(a), cos(a));
                    return m * v;
                }

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;

                    // copy position so that we can modify the instances
                    var pos = input.position;

                    // scale first
                    pos *= 0.8 + input.random.y * 0.3;

                    // pass scaled object position to fragment to add low-lying fog
                    output.vPos = pos;

                    // rotate around Y axis
                    let xz = rotate2d(pos.xz, input.random.x * 6.28);
                    pos.x = xz.x;
                    pos.z = xz.y;

                    // add position offset
                    pos += input.offset;

                    // add some hilliness to vary the height
                    pos.y += sin(pos.x * 0.5) * sin(pos.z * 0.5) * 0.5;

                    // pass model view position to fragment shader to get distance from camera
                    output.vMVPos = object.modelViewMatrix * vec4f(pos, 1.0);

                    output.position = object.projectionMatrix * output.vMVPos;
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uFogColor : vec3f,
                    uFogNear : f32,
                    uFogFar : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMap : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vMVPos : vec4f,
                    @location(2) vPos : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    var tex = textureSample(tMap, tMapSampler, input.vUv).rgb;

                    // add the fog relative to the distance from the camera
                    let dist = length(input.vMVPos.xyz);
                    let fog = smoothstep(material.uFogNear, material.uFogFar, dist);
                    tex = mix(tex, material.uFogColor, fog);

                    // add some fog along the height of each tree to simulate low-lying fog
                    tex = mix(tex, material.uFogColor, smoothstep(1.0, 0.0, input.vPos.y));

                    return vec4f(tex, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(0, 4, 8);
                camera.lookAt([0, 0, 0]);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const texture = new Texture(renderer);
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/forest.jpg';

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        tMap: { value: texture },

                        // Pass relevant uniforms for fog
                        uFogColor: { value: new Color('#ffffff') },
                        uFogNear: { value: 2 },
                        uFogFar: { value: 15 },
                    },
                });

                let mesh;
                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/forest.json`)).json();

                    const size = 8;
                    const num = size * size;

                    let offset = new Float32Array(num * 3);
                    let random = new Float32Array(num * 3);
                    for (let i = 0; i < num; i++) {
                        // Layout in a grid
                        offset.set([((i % size) - size * 0.5) * 2, 0, (Math.floor(i / size) - size * 0.5) * 2], i * 3);

                        random.set([Math.random(), Math.random(), Math.random()], i * 3);
                    }

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        offset: { instanced: true, size: 3, data: offset },
                        random: { instanced: true, size: 3, data: random },
                    });

                    mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    if (mesh) {
                        mesh.rotation.y += 0.003;
                        mesh.position.z = Math.sin(t * 0.0004) * 3.0;
                    }

                    program.uniforms.uTime.value = t * 0.001;
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
