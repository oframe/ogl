<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Sort Transparency</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Sort Transparency</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Mesh, Color, Plane } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vMVPos : vec4f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    var pos = input.position;
                    let dist = pow(length(output.vUv - 0.5), 2.0) - 0.25;
                    pos.z += dist * 0.5;
                    output.vMVPos = object.modelViewMatrix * vec4f(pos, 1.0);
                    output.position = object.projectionMatrix * output.vMVPos;
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uColor : vec3f,
                };

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vMVPos : vec4f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMap : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let alpha = textureSample(tMap, tMapSampler, input.vUv).g;

                    var color = material.uColor + input.vMVPos.xzy * 0.05;

                    let fogDist = length(input.vMVPos);
                    let fog = smoothstep(5.0, 10.0, fogDist);
                    color = mix(color, vec3f(1.0), fog);

                    if (alpha < 0.01) {
                        discard;
                    }

                    return vec4f(color, alpha);
                }
            `;

            // This demonstrates the default geometry sorting before rendering.
            // It does not include sorting between faces/points within a single geometry.

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 0, 7);
                camera.rotation.z = -0.3;

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const geometry = new Plane(renderer, {
                    widthSegments: 10,
                    heightSegments: 10,
                });

                const texture = new Texture(renderer);
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/leaf.jpg';

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                        uColor: { value: new Color('#ffc219') },
                    },
                    transparent: true,
                    cullFace: false,
                });

                const meshes = [];

                for (let i = 0; i < 50; i++) {
                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.position.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 3);
                    mesh.rotation.set(0, (Math.random() - 0.5) * 6.28, (Math.random() - 0.5) * 6.28);
                    mesh.scale.set(Math.random() * 0.5 + 0.2);
                    mesh.speed = Math.random() * 1.5 + 0.2;
                    mesh.setParent(scene);
                    meshes.push(mesh);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    meshes.forEach((mesh) => {
                        mesh.rotation.y += 0.05;
                        mesh.rotation.z += 0.05;
                        mesh.position.y -= 0.02 * mesh.speed;
                        if (mesh.position.y < -3) mesh.position.y += 6;
                    });

                    scene.rotation.y += 0.015;

                    // Objects are automatically sorted if renderer.sort === true
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
