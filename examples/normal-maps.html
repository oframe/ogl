<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Normal Maps</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Normal Maps</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Geometry, Mesh, Orbit } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uNormalScale : f32,
                    uNormalUVScale : f32,
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tDiffuse : texture_2d<f32>;
                @group(0) @binding(2) var tDiffuseSampler : sampler;
                @group(0) @binding(3) var tNormal : texture_2d<f32>;
                @group(0) @binding(4) var tNormalSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vMPos : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.vMPos = (object.modelMatrix * vec4f(input.position, 1.0)).xyz;

                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uNormalScale : f32,
                    uNormalUVScale : f32,
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tDiffuse : texture_2d<f32>;
                @group(0) @binding(2) var tDiffuseSampler : sampler;
                @group(0) @binding(3) var tNormal : texture_2d<f32>;
                @group(0) @binding(4) var tNormalSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vMPos : vec3f,
                };

                fn getNormal(vMPos : vec3f, vUv : vec2f, vNormal : vec3f) -> vec3f {
                    let pos_dx = dpdx(vMPos);
                    let pos_dy = -dpdy(vMPos);
                    let tex_dx = dpdx(vUv);
                    let tex_dy = -dpdy(vUv);

                    let t = normalize(pos_dx * tex_dy.y - pos_dy * tex_dx.y);
                    let b = normalize(-pos_dx * tex_dy.x + pos_dy * tex_dx.x);
                    let tbn = mat3x3f(t, b, normalize(vNormal));

                    var n = textureSample(tNormal, tNormalSampler, vUv * material.uNormalUVScale).rgb * 2.0 - 1.0;
                    n = vec3f(n.xy * material.uNormalScale, n.z);
                    let normal = normalize(tbn * n);

                    // Get world normal from view normal
                    return normalize((vec4f(normal, 0.0) * object.viewMatrix).xyz);
                }

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tDiffuse, tDiffuseSampler, input.vUv).rgb;
                    let normal = getNormal(input.vMPos, input.vUv, input.vNormal);

                    let light = normalize(vec3f(sin(material.uTime), 1.0, cos(material.uTime)));
                    let shading = dot(normal, light) * 0.5;

                    return vec4f(tex + shading, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(1.5, 0, 2);

                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const textureDiffuse = new Texture(renderer);
                const imgDiffuse = new Image();
                imgDiffuse.onload = () => (textureDiffuse.image = imgDiffuse);
                imgDiffuse.src = 'assets/granite-diffuse.jpg';

                const textureNormal = new Texture(renderer);
                const imgNormal = new Image();
                imgNormal.onload = () => (textureNormal.image = imgNormal);
                imgNormal.src = 'assets/granite-normal.jpg';

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tDiffuse: { value: textureDiffuse },
                        tNormal: { value: textureNormal },
                        uNormalScale: { value: 2 },
                        uNormalUVScale: { value: 1 },
                        uTime: { value: 0 },
                    },
                });

                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/rounded-cube.json`)).json();

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                    });

                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    program.uniforms.uTime.value = t * 0.001;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
