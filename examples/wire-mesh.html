<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • WireMesh</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">WireMesh (wireframe). Model by Google Poly</div>
        <script type="module">
            import { Renderer, Camera, Orbit, Transform, Geometry, WireMesh, Cylinder, Vec3, Color, NormalProgram } from '../src/index.js';

            {
                const modelData = await fetch('./assets/fox.json').then((r) => r.json());

                const renderer = await Renderer.create();
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 15 });
                camera.position.set(15, 4, 20);

                const controls = new Orbit(camera, {
                    target: new Vec3(0, 0, 0),
                });

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const cylinderGeometry = new Cylinder(renderer);

                /* Just switch between Mesh and WireMesh to see mesh wireframe.
                In WireMesh `program` property are not required and will be ignored */
                // const cylinderMesh = new Mesh(renderer, { geometry: cylinderGeometry, program: NormalProgram(renderer) });
                const cylinderMesh = new WireMesh(renderer, { geometry: cylinderGeometry, program: NormalProgram(renderer) });
                cylinderMesh.setParent(scene);
                cylinderMesh.position.y = 1.5;

                const modelGeometry = new Geometry(renderer, {
                    position: { size: 3, data: new Float32Array(modelData.position) },
                    normal: { size: 3, data: new Float32Array(modelData.normal) },
                    uv: { size: 2, data: new Float32Array(modelData.uv) },
                });

                /* Use wireColor to change wire color */
                // const modelMesh = new Mesh(renderer, { geometry: modelGeometry, program: NormalProgram(renderer) });
                const modelMesh = new WireMesh(renderer, { geometry: modelGeometry, wireColor: new Color(1, 0.75, 0) });
                modelMesh.setParent(scene);
                modelMesh.scale.set(0.75, 0.75, 0.75);
                modelMesh.position.y = -1.5;

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    scene.rotation.y += -0.005;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
