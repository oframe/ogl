<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Anisotropic</title>
        <link href="assets/main.css" rel="stylesheet" />
        <style>
            .split {
                width: 100%;
                display: flex;
                justify-content: space-evenly;
            }
        </style>
    </head>
    <body>
        <div class="Info">Anisotropic</div>
        <div class="Info split"><span>Texture anisotropy: None</span> <span>Texture anisotropy: 16</span></div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Mesh, Plane } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    fSlide : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMap : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;
                @group(0) @binding(3) var tMapA : texture_2d<f32>;
                @group(0) @binding(4) var tMapASampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    fSlide : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMap : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;
                @group(0) @binding(3) var tMapA : texture_2d<f32>;
                @group(0) @binding(4) var tMapASampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMap, tMapSampler, input.vUv).rgb;
                    let texA = textureSample(tMapA, tMapASampler, input.vUv).rgb;

                    let color = mix(tex, texA, step(material.fSlide, input.vUv.x)) + 0.1;
                    return vec4f(color, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer);
                camera.position.set(0, 0, 1);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                // By default, anisotropy is not active
                const texture = new Texture(renderer, { generateMipmaps: true });

                // Pass in number of anisotropic samples to activate
                const textureAnisotropy = new Texture(renderer, { anisotropy: 16, generateMipmaps: true });

                const img = new Image();
                img.src = 'assets/grid.jpg';
                img.onload = () => {
                    texture.image = img;
                    textureAnisotropy.image = img;
                };

                const geometry = new Plane(renderer);

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        tMap: { value: texture },
                        tMapA: { value: textureAnisotropy },
                        fSlide: { value: 0.5 },
                    },
                });

                const mesh = new Mesh(renderer, { geometry, program });
                mesh.scale.set(1, 2, 1);
                mesh.rotation.set(-1.5, 0, 0);

                mesh.setParent(scene);

                renderer.canvas.addEventListener('mousemove', (e) => {
                    const x = (2 * e.x) / renderer.canvas.width;
                    program.uniforms.fSlide.value = x;
                });

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
