<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL &bull; Load GLTF</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info" style="color: #fff">
            Load GLTF (Graphics Language Transmission Format). Model by
            <a href="https://sketchfab.com/3d-models/hershel-little-america-f4d7a0ed8af2453e9adc632278c9aa50" target="_blank">VRModelFactory</a>
            <br /><a href="/ogl/examples/?src=gltf-draco-webp.html" target="_top">Draco and WebP Compressed Version</a>
        </div>
        <script type="module">
            import { Renderer, Camera, Transform, Orbit, Program, GLTFLoader, Vec3, TextureLoader } from '../src/index.js';

            /**
             * Build WGSL vertex + fragment shaders dynamically based on the
             * attributes and material textures of each GLTF mesh node.
             *
             * Because WGSL has no preprocessor, we generate different shader
             * strings per material variant, only including the bindings that
             * are actually present.
             */

            function buildShaders(node, mat) {
                // ---- Determine which vertex attributes exist ----
                const attrs = Object.keys(node.geometry.attributes).filter((k) => k !== 'index');
                const hasUV = attrs.includes('uv');
                const hasNormal = attrs.includes('normal');

                // Build @location map from attribute iteration order
                const locationMap = {};
                attrs.forEach((name, i) => (locationMap[name] = i));

                // ---- Determine which textures exist ----
                const hasColorMap = !!mat.baseColorTexture;
                const hasNormalMap = !!mat.normalTexture;
                const hasRMMap = !!mat.metallicRoughnessTexture;
                const hasOccMap = !!mat.occlusionTexture;
                const hasEmissiveMap = !!mat.emissiveTexture;
                const isAlphaMask = mat.alphaMode === 'MASK';

                // ---- Material uniform struct ----
                // Always include all scalar uniforms (they are small).
                const materialStructWGSL = /* wgsl */ `
                struct MaterialUniforms {
                    uBaseColorFactor : vec4f,
                    uRoughness : f32,
                    uMetallic : f32,
                    uNormalScale : f32,
                    uAlpha : f32,
                    uAlphaCutoff : f32,
                    uEnvDiffuse : f32,
                    uEnvSpecular : f32,
                    _pad0 : f32,
                    uEmissive : vec3f,
                    _pad1 : f32,
                    uLightDirection : vec3f,
                    _pad2 : f32,
                    uLightColor : vec3f,
                };
                `;

                // ---- Build texture bindings for fragment shader ----
                // Textures follow the uniform buffer in binding order.
                // Each texture uses 2 bindings (texture + sampler).
                let texBindingIndex = 1; // 0 = uniform buffer
                const texBindings = [];
                const texNames = [];

                function addTex(name) {
                    texBindings.push(
                        `@group(0) @binding(${texBindingIndex}) var ${name} : texture_2d<f32>;`,
                        `@group(0) @binding(${texBindingIndex + 1}) var ${name}Sampler : sampler;`
                    );
                    texNames.push(name);
                    texBindingIndex += 2;
                }

                // Order must match the uniform order passed to Program
                if (hasColorMap) addTex('tBaseColor');
                if (hasRMMap) addTex('tRM');
                if (hasNormalMap) addTex('tNormal');
                if (hasOccMap) addTex('tOcclusion');
                if (hasEmissiveMap) addTex('tEmissive');
                addTex('tLUT');
                addTex('tEnvDiffuse');
                addTex('tEnvSpecular');

                const texBindingsWGSL = texBindings.join('\n                ');

                // ---- Object UBO (bind group 1) ----
                const objectUBOWGSL = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };
                @group(1) @binding(0) var<uniform> object : ObjectUniforms;
                `;

                // ---- Vertex shader ----
                const vertexInputMembers = [];
                vertexInputMembers.push(`@location(${locationMap.position}) position : vec3f`);
                if (hasNormal) vertexInputMembers.push(`@location(${locationMap.normal}) normal : vec3f`);
                if (hasUV) vertexInputMembers.push(`@location(${locationMap.uv}) uv : vec2f`);

                let varyingIndex = 0;
                const vertexOutputMembers = [`@builtin(position) position : vec4f`];
                const fragInputMembers = [];

                if (hasUV) {
                    vertexOutputMembers.push(`@location(${varyingIndex}) vUv : vec2f`);
                    fragInputMembers.push(`@location(${varyingIndex}) vUv : vec2f`);
                    varyingIndex++;
                }
                if (hasNormal) {
                    vertexOutputMembers.push(`@location(${varyingIndex}) vNormal : vec3f`);
                    fragInputMembers.push(`@location(${varyingIndex}) vNormal : vec3f`);
                    varyingIndex++;
                }
                vertexOutputMembers.push(`@location(${varyingIndex}) vMPos : vec3f`);
                fragInputMembers.push(`@location(${varyingIndex}) vMPos : vec3f`);
                varyingIndex++;

                const vertex = /* wgsl */ `
                ${materialStructWGSL}
                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                ${objectUBOWGSL}

                struct VertexInput {
                    ${vertexInputMembers.join(',\n                    ')},
                };

                struct VertexOutput {
                    ${vertexOutputMembers.join(',\n                    ')},
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    ${hasUV ? 'output.vUv = input.uv;' : ''}
                    ${hasNormal ? 'output.vNormal = normalize(object.normalMatrix * input.normal);' : ''}

                    let mPos = object.modelMatrix * vec4f(input.position, 1.0);
                    output.vMPos = mPos.xyz / mPos.w;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
                `;

                // ---- Fragment shader ----
                const fragment = /* wgsl */ `
                ${materialStructWGSL}
                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                ${texBindingsWGSL}

                ${objectUBOWGSL}

                struct FragmentInput {
                    ${fragInputMembers.join(',\n                    ')},
                };

                const PI = 3.14159265359;
                const RECIPROCAL_PI = 0.31830988618;
                const RECIPROCAL_PI2 = 0.15915494;
                const LN2 = 0.6931472;
                const ENV_LODS = 6.0;

                fn SRGBtoLinear(srgb : vec4f) -> vec4f {
                    let linOut = pow(srgb.xyz, vec3f(2.2));
                    return vec4f(linOut, srgb.w);
                }

                fn RGBMToLinear(value : vec4f) -> vec4f {
                    let maxRange = 6.0;
                    return vec4f(value.xyz * value.w * maxRange, 1.0);
                }

                fn linearToSRGB(color : vec3f) -> vec3f {
                    return pow(color, vec3f(1.0 / 2.2));
                }

                ${hasNormalMap ? `
                fn getNormal(vMPos : vec3f, vUv : vec2f, vNormal : vec3f) -> vec3f {
                    let pos_dx = dpdx(vMPos);
                    let pos_dy = -dpdy(vMPos);
                    let tex_dx = dpdx(vUv);
                    let tex_dy = -dpdy(vUv);

                    let t = normalize(pos_dx * tex_dy.y - pos_dy * tex_dx.y);
                    let b = normalize(-pos_dx * tex_dy.x + pos_dy * tex_dx.x);
                    let tbn = mat3x3f(t, b, normalize(vNormal));

                    var n = textureSample(tNormal, tNormalSampler, vUv).rgb * 2.0 - 1.0;
                    n = vec3f(n.xy * material.uNormalScale, n.z);
                    return normalize(tbn * n);
                }
                ` : ''}

                fn specularReflection(specularEnvR0 : vec3f, specularEnvR90 : vec3f, VdH : f32) -> vec3f {
                    return specularEnvR0 + (specularEnvR90 - specularEnvR0) * pow(clamp(1.0 - VdH, 0.0, 1.0), 5.0);
                }

                fn geometricOcclusion(NdL : f32, NdV : f32, roughness : f32) -> f32 {
                    let r = roughness;
                    let attenuationL = 2.0 * NdL / (NdL + sqrt(r * r + (1.0 - r * r) * (NdL * NdL)));
                    let attenuationV = 2.0 * NdV / (NdV + sqrt(r * r + (1.0 - r * r) * (NdV * NdV)));
                    return attenuationL * attenuationV;
                }

                fn microfacetDistribution(roughness : f32, NdH : f32) -> f32 {
                    let roughnessSq = roughness * roughness;
                    let f = (NdH * roughnessSq - NdH) * NdH + 1.0;
                    return roughnessSq / (PI * f * f);
                }

                fn cartesianToPolar(n : vec3f) -> vec2f {
                    var uv : vec2f;
                    uv.x = atan2(n.z, n.x) * RECIPROCAL_PI2 + 0.5;
                    uv.y = asin(n.y) * RECIPROCAL_PI + 0.5;
                    return uv;
                }

                struct IBLResult {
                    diffuse : vec3f,
                    specular : vec3f,
                };

                fn getIBLContribution(NdV : f32, roughness : f32, n : vec3f, reflection : vec3f, diffuseColor : vec3f, specularColor : vec3f) -> IBLResult {
                    let brdf = SRGBtoLinear(textureSample(tLUT, tLUTSampler, vec2f(NdV, roughness))).rgb;

                    let diffuseLight = RGBMToLinear(textureSample(tEnvDiffuse, tEnvDiffuseSampler, cartesianToPolar(n))).rgb;
                    let mixedDiffuse = mix(vec3f(1.0), diffuseLight, material.uEnvDiffuse);

                    // Sample 2 levels and mix between to get smoother degradation
                    var blend = roughness * ENV_LODS;
                    let level0 = floor(blend);
                    let level1 = min(ENV_LODS, level0 + 1.0);
                    blend -= level0;

                    // Sample the specular env map atlas depending on the roughness value
                    var uvSpec = cartesianToPolar(reflection);
                    uvSpec.y /= 2.0;

                    var uv0 = uvSpec;
                    var uv1 = uvSpec;

                    uv0 /= pow(2.0, level0);
                    uv0.y += 1.0 - exp(-LN2 * level0);

                    uv1 /= pow(2.0, level1);
                    uv1.y += 1.0 - exp(-LN2 * level1);

                    let specular0 = RGBMToLinear(textureSample(tEnvSpecular, tEnvSpecularSampler, uv0)).rgb;
                    let specular1 = RGBMToLinear(textureSample(tEnvSpecular, tEnvSpecularSampler, uv1)).rgb;
                    let specularLight = mix(specular0, specular1, blend);

                    let diffuse = mixedDiffuse * diffuseColor;

                    // Bit of extra reflection for smooth materials
                    let reflectivity = pow((1.0 - roughness), 2.0) * 0.05;
                    var specular = specularLight * (specularColor * brdf.x + brdf.y + reflectivity);
                    specular *= material.uEnvSpecular;

                    return IBLResult(diffuse, specular);
                }

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    var baseColor = material.uBaseColorFactor;
                    ${hasColorMap && hasUV ? `baseColor *= SRGBtoLinear(textureSample(tBaseColor, tBaseColorSampler, input.vUv));` : ''}

                    // Get base alpha
                    var alpha = baseColor.a;

                    ${isAlphaMask ? `if (alpha < material.uAlphaCutoff) { discard; }` : ''}

                    // RM map packed as gb = [nothing, roughness, metallic, nothing]
                    var rmSample = vec4f(1.0);
                    ${hasRMMap && hasUV ? `rmSample = textureSample(tRM, tRMSampler, input.vUv);` : ''}
                    let roughness = clamp(rmSample.g * material.uRoughness, 0.04, 1.0);
                    let metallic = clamp(rmSample.b * material.uMetallic, 0.04, 1.0);

                    let f0 = vec3f(0.04);
                    let diffuseColor = baseColor.rgb * (vec3f(1.0) - f0) * (1.0 - metallic);
                    let specularColor = mix(f0, baseColor.rgb, metallic);

                    let specularEnvR0 = specularColor;
                    let specularEnvR90 = vec3f(clamp(max(max(specularColor.r, specularColor.g), specularColor.b) * 25.0, 0.0, 1.0));

                    ${hasNormalMap && hasNormal && hasUV ? `let N = getNormal(input.vMPos, input.vUv, input.vNormal);` : hasNormal ? `let N = normalize(input.vNormal);` : `let N = vec3f(0.0, 1.0, 0.0);`}
                    let V = normalize(object.cameraPosition - input.vMPos);
                    let L = normalize(material.uLightDirection);
                    let H = normalize(L + V);
                    let reflection = normalize(reflect(-V, N));

                    let NdL = clamp(dot(N, L), 0.001, 1.0);
                    let NdV = clamp(abs(dot(N, V)), 0.001, 1.0);
                    let NdH = clamp(dot(N, H), 0.0, 1.0);
                    let LdH = clamp(dot(L, H), 0.0, 1.0);
                    let VdH = clamp(dot(V, H), 0.0, 1.0);

                    let F = specularReflection(specularEnvR0, specularEnvR90, VdH);
                    let G = geometricOcclusion(NdL, NdV, roughness);
                    let D = microfacetDistribution(roughness, NdH);

                    let diffuseContrib = (1.0 - F) * (diffuseColor / PI);
                    let specContrib = F * G * D / (4.0 * NdL * NdV);

                    // Shading based off lights
                    var color = NdL * material.uLightColor * (diffuseContrib + specContrib);

                    // Add lights spec to alpha for reflections on transparent surfaces (glass)
                    alpha = max(alpha, max(max(specContrib.r, specContrib.g), specContrib.b));

                    // Calculate IBL lighting
                    let ibl = getIBLContribution(NdV, roughness, N, reflection, diffuseColor, specularColor);

                    // Add IBL on top of color
                    color += ibl.diffuse + ibl.specular;

                    // Add IBL spec to alpha for reflections on transparent surfaces (glass)
                    alpha = max(alpha, max(max(ibl.specular.r, ibl.specular.g), ibl.specular.b));

                    ${hasEmissiveMap && hasUV ? `
                    // Emissive
                    let emissive = SRGBtoLinear(textureSample(tEmissive, tEmissiveSampler, input.vUv)).rgb * material.uEmissive;
                    color += emissive;
                    ` : ''}

                    // Convert to sRGB to display
                    let finalColor = linearToSRGB(color);

                    // Apply uAlpha uniform at the end to overwrite any specular additions on transparent surfaces
                    return vec4f(finalColor, alpha * material.uAlpha);
                }
                `;

                return { vertex, fragment };
            }

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 0.1, g: 0.1, b: 0.1, a: 1 };

                const camera = new Camera(renderer, { near: 1, far: 1000 });
                camera.position.set(30, 15, -30);
                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                let gltf;

                // Common textures for uber shader
                const lutTexture = TextureLoader.load(renderer, {
                    src: 'assets/pbr/lut.png',
                });
                const envDiffuseTexture = TextureLoader.load(renderer, {
                    src: 'assets/sunset-diffuse-RGBM.png',
                });
                const envSpecularTexture = TextureLoader.load(renderer, {
                    src: 'assets/sunset-specular-RGBM.png',
                });

                {
                    loadInitial();
                    handlers();
                }

                async function loadInitial() {
                    gltf = await GLTFLoader.load(renderer, `assets/gltf/hershel.glb`);
                    addGLTF(gltf);
                }

                function handlers() {
                    renderer.canvas.addEventListener('dragover', over);
                    renderer.canvas.addEventListener('drop', drop);
                }

                function over(e) {
                    e.preventDefault();
                }

                function drop(e) {
                    e.preventDefault();
                    const file = e.dataTransfer.files[0];
                    const reader = new FileReader();
                    reader.readAsArrayBuffer(file);
                    reader.onload = async function (e) {
                        let desc;
                        const textDecoder = new TextDecoder();
                        if (textDecoder.decode(new Uint8Array(e.target.result, 0, 4)) === 'glTF') {
                            desc = GLTFLoader.unpackGLB(e.target.result);
                        } else {
                            desc = JSON.parse(textDecoder.decode(e.target.result));
                        }
                        const dir = '';
                        gltf = await GLTFLoader.parse(renderer, desc, dir);
                        addGLTF(gltf);
                    };
                }

                function addGLTF(gltf) {
                    scene.children.forEach((child) => child.setParent(null));
                    console.log(gltf);

                    const s = gltf.scene || gltf.scenes[0];
                    s.forEach((root) => {
                        root.setParent(scene);
                        root.traverse((node) => {
                            if (node.program) {
                                node.program = createProgram(node);
                            }
                        });
                    });

                    // Calculate world matrices for bounds
                    scene.updateMatrixWorld();

                    // Calculate rough world bounds to update camera
                    const min = new Vec3(+Infinity);
                    const max = new Vec3(-Infinity);
                    const center = new Vec3();
                    const scale = new Vec3();

                    const boundsMin = new Vec3();
                    const boundsMax = new Vec3();
                    const boundsCenter = new Vec3();
                    const boundsScale = new Vec3();

                    gltf.meshes.forEach((group) => {
                        group.primitives.forEach((mesh) => {
                            if (!mesh.parent) return; // Skip unattached

                            if (!mesh.geometry.bounds) mesh.geometry.computeBoundingSphere();

                            boundsCenter.copy(mesh.geometry.bounds.center).applyMatrix4(mesh.worldMatrix);

                            // Get max world scale axis
                            mesh.worldMatrix.getScaling(boundsScale);
                            const radiusScale = Math.max(Math.max(boundsScale[0], boundsScale[1]), boundsScale[2]);
                            const radius = mesh.geometry.bounds.radius * radiusScale;

                            boundsMin.set(-radius).add(boundsCenter);
                            boundsMax.set(+radius).add(boundsCenter);

                            // Apply world matrix to bounds
                            for (let i = 0; i < 3; i++) {
                                min[i] = Math.min(min[i], boundsMin[i]);
                                max[i] = Math.max(max[i], boundsMax[i]);
                            }
                        });
                    });
                    scale.sub(max, min);
                    const maxRadius = Math.max(Math.max(scale[0], scale[1]), scale[2]) * 0.5;
                    center.add(min, max).divide(2);

                    camera.position
                        .set(1, 0.5, -1)
                        .normalize()
                        .multiply(maxRadius * 2.5)
                        .add(center);
                    controls.target.copy(center);
                    controls.forcePosition();
                    const far = maxRadius * 5;
                    const near = far * 0.001;
                    camera.perspective({ near, far });
                }

                function createProgram(node) {
                    const mat = node.program.gltfMaterial || {};

                    const hasColorMap = !!mat.baseColorTexture;
                    const hasNormalMap = !!mat.normalTexture;
                    const hasRMMap = !!mat.metallicRoughnessTexture;
                    const hasOccMap = !!mat.occlusionTexture;
                    const hasEmissiveMap = !!mat.emissiveTexture;

                    // Build WGSL shaders dynamically based on available attributes/textures
                    const { vertex, fragment } = buildShaders(node, mat);

                    // Build uniforms object.
                    // Order of texture uniforms MUST match the order in buildShaders addTex() calls.
                    // Scalar uniforms go first (packed into the uniform buffer).
                    const uniforms = {
                        uBaseColorFactor: { value: mat.baseColorFactor || [1, 1, 1, 1] },
                        uRoughness: { value: mat.roughnessFactor !== undefined ? mat.roughnessFactor : 1 },
                        uMetallic: { value: mat.metallicFactor !== undefined ? mat.metallicFactor : 1 },
                        uNormalScale: { value: mat.normalTexture ? mat.normalTexture.scale || 1 : 1 },
                        uAlpha: { value: 1 },
                        uAlphaCutoff: { value: mat.alphaCutoff !== undefined ? mat.alphaCutoff : 0.5 },
                        uEnvDiffuse: { value: 0.5 },
                        uEnvSpecular: { value: 0.5 },
                        uEmissive: { value: mat.emissiveFactor || [0, 0, 0] },
                        uLightDirection: { value: new Vec3(0, 1, 1) },
                        uLightColor: { value: new Vec3(2.5) },
                    };

                    // Add textures in the same order as buildShaders
                    if (hasColorMap) uniforms.tBaseColor = { value: mat.baseColorTexture.texture };
                    if (hasRMMap) uniforms.tRM = { value: mat.metallicRoughnessTexture.texture };
                    if (hasNormalMap) uniforms.tNormal = { value: mat.normalTexture.texture };
                    if (hasOccMap) uniforms.tOcclusion = { value: mat.occlusionTexture.texture };
                    if (hasEmissiveMap) uniforms.tEmissive = { value: mat.emissiveTexture.texture };
                    uniforms.tLUT = { value: lutTexture };
                    uniforms.tEnvDiffuse = { value: envDiffuseTexture };
                    uniforms.tEnvSpecular = { value: envSpecularTexture };

                    const program = new Program(renderer, {
                        vertex,
                        fragment,
                        uniforms,
                        transparent: mat.alphaMode === 'BLEND',
                        cullFace: mat.doubleSided ? false : 'back',
                    });

                    return program;
                }

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    // Play first animation
                    if (gltf && gltf.animations && gltf.animations.length) {
                        let { animation } = gltf.animations[0];
                        animation.elapsed += 0.01;
                        animation.update();
                    }

                    controls.update();
                    renderer.render({ scene, camera, sort: false, frustumCull: false });
                }
            }
        </script>
    </body>
</html>
