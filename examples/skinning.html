<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL &bull; Skinning</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Skinning. Model by <a href="https://artella.lpages.co/artella-lily-snout-giveaway/" target="_blank">Carlos Quintero and Zach Baharov</a>.</div>
        <script type="module">
            import { Renderer, Transform, Camera, Geometry, Texture, Program, Mesh, Orbit, Plane, Skin } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    boneTextureSize : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMapTex : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;
                @group(0) @binding(3) var boneTextureTex : texture_2d<f32>;
                @group(0) @binding(4) var boneTextureSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                    @location(3) skinIndex : vec4f,
                    @location(4) skinWeight : vec4f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                fn getBoneMatrix(boneIdx : f32) -> mat4x4f {
                    let j = boneIdx * 4.0;
                    let size = material.boneTextureSize;
                    let x = j % size;
                    let y = floor(j / size);
                    let dx = 1.0 / size;
                    let dy = 1.0 / size;
                    let yCoord = dy * (y + 0.5);

                    let v1 = textureSampleLevel(boneTextureTex, boneTextureSampler, vec2f(dx * (x + 0.5), yCoord), 0.0);
                    let v2 = textureSampleLevel(boneTextureTex, boneTextureSampler, vec2f(dx * (x + 1.5), yCoord), 0.0);
                    let v3 = textureSampleLevel(boneTextureTex, boneTextureSampler, vec2f(dx * (x + 2.5), yCoord), 0.0);
                    let v4 = textureSampleLevel(boneTextureTex, boneTextureSampler, vec2f(dx * (x + 3.5), yCoord), 0.0);

                    return mat4x4f(v1, v2, v3, v4);
                }

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    var vNormal = normalize(object.normalMatrix * input.normal);

                    let boneMatX = getBoneMatrix(input.skinIndex.x);
                    let boneMatY = getBoneMatrix(input.skinIndex.y);
                    let boneMatZ = getBoneMatrix(input.skinIndex.z);
                    let boneMatW = getBoneMatrix(input.skinIndex.w);

                    // Update normal
                    let skinMatrix = input.skinWeight.x * boneMatX
                                   + input.skinWeight.y * boneMatY
                                   + input.skinWeight.z * boneMatZ
                                   + input.skinWeight.w * boneMatW;
                    output.vNormal = (skinMatrix * vec4f(vNormal, 0.0)).xyz;

                    // Update position
                    let bindPos = vec4f(input.position, 1.0);
                    let transformed = boneMatX * bindPos * input.skinWeight.x
                                    + boneMatY * bindPos * input.skinWeight.y
                                    + boneMatZ * bindPos * input.skinWeight.z
                                    + boneMatW * bindPos * input.skinWeight.w;

                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(transformed.xyz, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    boneTextureSize : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMapTex : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMapTex, tMapSampler, input.vUv).rgb;
                    let normal = normalize(input.vNormal);

                    let light = vec3f(0.0, 1.0, 0.0);
                    let shading = min(0.0, dot(normal, light) * 0.2);

                    return vec4f(tex + shading, 1.0);
                }
            `;

            const shadowVertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const shadowFragment = /* wgsl */ `
                @group(0) @binding(0) var tMapTex : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let shadow = textureSample(tMapTex, tMapSampler, input.vUv).g;
                    return vec4f(0.0, 0.0, 0.0, shadow);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(6, 2, 6);

                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                let skin, animation;
                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/snout-rig.json`)).json();
                    // Rig JSON data format
                    // format is the same as regular model json, with the addition of the rig object
                    //
                    // {
                    //     position: [],
                    //     skinWeight: [],
                    //     ... other vertex attributes

                    //     rig: {
                    //         bones: [
                    //             {name: 'root', parent: -1},
                    //             {name: 'spine', parent: 0},
                    //             ... for whole bone hierarchy
                    //         ],
                    //         bindPose: {
                    //             ... for the following properties, values concatenated for all bones, arranged in order of bones array
                    //             position: [x1, y1, z1, x2, y2, z2, ...],
                    //             quaternion: [x1, y1, z1, w1, x2, y2, z2, w2, ...],
                    //             scale: [x1, y1, z1, x2, y2, z2, ...],
                    //         },
                    //     },
                    // }

                    const animationData = await (await fetch(`assets/snout-anim.json`)).json();
                    // Animation JSON format
                    // data is expected to be baked for each frame, therefore duration is derived
                    // from number of frames in array.
                    // {
                    //     frames: [
                    //         {
                    //             ... identical format to bindPose above, values are concatenated
                    //             position: [x1, y1, z1, x2, y2, z2, ...],
                    //             quaternion: [x1, y1, z1, w1, x2, y2, z2, w2, ...],
                    //             scale: [x1, y1, z1, x2, y2, z2, ...],
                    //         },
                    //         ... continue for number of frames
                    //     ]
                    // }

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                        skinIndex: { size: 4, data: new Float32Array(data.skinIndex) },
                        skinWeight: { size: 4, data: new Float32Array(data.skinWeight) },
                    });

                    const texture = new Texture(renderer);
                    const img = new Image();
                    img.onload = () => (texture.image = img);
                    img.src = 'assets/snout.jpg';

                    // Placeholder bone texture so Program detects it as a texture binding at construction.
                    // Skin.constructor will replace the value with the actual bone texture.
                    const placeholderBoneTexture = new Texture(renderer, {
                        width: 4,
                        height: 4,
                        format: 'rgba32float',
                        minFilter: 'nearest',
                        magFilter: 'nearest',
                        generateMipmaps: false,
                        flipY: false,
                    });

                    const program = new Program(renderer, {
                        vertex,
                        fragment,
                        uniforms: {
                            // Scalar uniforms first (packed into uniform buffer at binding 0)
                            boneTextureSize: { value: 4 },
                            // Textures follow in order: tMap then boneTexture
                            tMap: { value: texture },
                            boneTexture: { value: placeholderBoneTexture },
                        },
                    });

                    // Skin extends Mesh - so on top of passing in geometry and program,
                    // pass in the rig data, including a list of bones and their bind transforms.
                    // The Skin class will set 'boneTexture' and 'boneTextureSize' uniform values.
                    skin = new Skin(renderer, { rig: data.rig, geometry, program });
                    skin.setParent(scene);

                    skin.scale.set(0.01);
                    skin.position.y = -1;

                    // Helper function to add animation to skin's bones.
                    // The Animation class can be used directly for any hierarchy - is not solely for bones.
                    animation = skin.addAnimation(animationData);
                }

                // Added baked occlusion on the floor to help ground the character
                initShadow();
                function initShadow() {
                    const texture = new Texture(renderer);
                    const img = new Image();
                    img.onload = () => (texture.image = img);
                    img.src = 'assets/snout-shadow.jpg';

                    const geometry = new Plane(renderer, { width: 7, height: 7 });
                    const program = new Program(renderer, {
                        vertex: shadowVertex,
                        fragment: shadowFragment,
                        uniforms: {
                            tMap: { value: texture },
                        },
                        transparent: true,
                        cullFace: false,
                    });

                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.y = -1;
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    // Control animation but updating the elapsed value.
                    // It uses modulo to repeat the animation range,
                    // so below is playing a never-ending loop.
                    if (animation) animation.elapsed += 0.1;

                    // Calling 'update' updates the bones with all of the
                    // attached animations based on their weights.
                    if (skin) skin.update();

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
