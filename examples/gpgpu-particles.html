<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • GPGPU Particles (General-Purpose computing on Graphics Processing Units)</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">GPGPU Particles (General-Purpose computing on Graphics Processing Units)</div>
        <script type="module">
            import { Renderer, Camera, Geometry, Program, Mesh, Vec2, Compute } from '../src/index.js';

            // ---------------------------------------------------------------
            // Compute shader: updates velocity and position storage buffers
            // ---------------------------------------------------------------
            const computeShader = /* wgsl */ `
                struct Params {
                    uTime : f32,
                    mouseX : f32,
                    mouseY : f32,
                    _pad : f32,
                };

                @group(0) @binding(0) var<storage, read_write> positions : array<vec4f>;
                @group(0) @binding(1) var<storage, read_write> velocities : array<vec4f>;
                @group(0) @binding(2) var<uniform> params : Params;

                @compute @workgroup_size(64)
                fn main(@builtin(global_invocation_id) id : vec3u) {
                    let i = id.x;
                    if (i >= arrayLength(&positions)) {
                        return;
                    }

                    var pos = positions[i];
                    var vel = velocities[i];

                    // Mouse repulsion
                    let mouse = vec2f(params.mouseX, params.mouseY);
                    let toMouse = pos.xy - mouse;
                    let dist = length(toMouse);
                    let strength = smoothstep(0.3, 0.0, dist);
                    let dir = select(vec2f(0.0), normalize(toMouse), dist > 0.0001);
                    vel = vec4f(vel.xy + strength * dir * 0.5, 0.0, 1.0);

                    // Friction
                    vel = vec4f(vel.xy * 0.98, 0.0, 1.0);

                    // Integrate position
                    pos = vec4f(pos.xy + vel.xy * 0.01, 0.0, 1.0);

                    // Wrap around bounds [-1, 1]
                    let limits = vec2f(1.0);
                    var p = pos.xy;
                    p += (1.0 - step(-limits, p)) * limits * 2.0;
                    p -= step(limits, p) * limits * 2.0;
                    pos = vec4f(p, 0.0, 1.0);

                    positions[i] = pos;
                    velocities[i] = vel;
                }
            `;

            // ---------------------------------------------------------------
            // Render shaders: instanced quads (WebGPU has no gl_PointSize)
            // Each particle is a small billboard quad sized in clip space.
            // ---------------------------------------------------------------
            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uResolution : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct VertexInput {
                    @location(0) quadPos : vec2f,
                    @location(1) quadUv : vec2f,
                    @location(2) random : vec4f,
                    @location(3) position : vec4f,
                    @location(4) velocity : vec4f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vRandom : vec4f,
                    @location(1) vVelocity : vec4f,
                    @location(2) vPointCoord : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vRandom = input.random;
                    output.vVelocity = input.velocity;
                    output.vPointCoord = input.quadUv;

                    var pos = input.position.xy;

                    // Add some subtle random oscillating so it never fully stops
                    pos += sin(vec2f(material.uTime) * input.random.wy + input.random.xz * 6.28) * input.random.zy * 0.1;

                    // Point size in pixels (matching original WebGL gl_PointSize)
                    var pointSize = mix(2.0, 15.0, input.random.x);
                    pointSize *= 1.0 + min(1.0, length(input.velocity.xy));

                    // Convert pixel size to clip space and offset quad vertex
                    let pixelToClip = 2.0 / material.uResolution;
                    pos += input.quadPos * pointSize * pixelToClip;

                    output.position = vec4f(pos, 0.0, 1.0);

                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                    uResolution : vec2f,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct FragmentInput {
                    @location(0) vRandom : vec4f,
                    @location(1) vVelocity : vec4f,
                    @location(2) vPointCoord : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    // Circle shape (replaces gl_PointCoord discard)
                    if (length(input.vPointCoord - vec2f(0.5)) > 0.5) {
                        discard;
                    }

                    // Random colour
                    let color = vec3f(input.vRandom.zy, 1.0) * mix(0.7, 2.0, input.vRandom.w);

                    // Fade to white when not moving, with an ease off curve
                    let speed = length(input.vVelocity.xy);
                    let blend = 1.0 - pow(1.0 - smoothstep(0.0, 0.7, speed), 2.0);
                    let finalColor = mix(vec3f(1.0), color, blend);

                    return vec4f(finalColor, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                // Camera is not strictly used for projection here (we output clip coords directly),
                // but we keep it for the Mesh pipeline to work correctly.
                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(0, 0, 5);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                // The number of particles
                const numParticles = 65536;

                // Create the initial data arrays for position and velocity (vec4 per particle)
                const initialPositionData = new Float32Array(numParticles * 4);
                const initialVelocityData = new Float32Array(numParticles * 4);

                // Random attribute (static, per-particle)
                const randomData = new Float32Array(numParticles * 4);

                for (let i = 0; i < numParticles; i++) {
                    initialPositionData.set(
                        [
                            (Math.random() - 0.5) * 2.0,
                            (Math.random() - 0.5) * 2.0,
                            0.0,
                            1.0,
                        ],
                        i * 4
                    );
                    initialVelocityData.set([0.0, 0.0, 0.0, 1.0], i * 4);
                    randomData.set([Math.random(), Math.random(), Math.random(), Math.random()], i * 4);
                }

                // ---------------------------------------------------------------
                // Set up compute shader for particle simulation
                // ---------------------------------------------------------------
                const compute = new Compute(renderer, {
                    shader: computeShader,
                    uniforms: {
                        positions: { storage: true, data: initialPositionData },
                        velocities: { storage: true, data: initialVelocityData },
                        params: { value: new Float32Array([0, 0, 0, 0]) },
                    },
                    dataLength: numParticles,
                    workgroupSize: [64, 1, 1],
                });

                // ---------------------------------------------------------------
                // Set up rendering geometry (instanced quads)
                // ---------------------------------------------------------------
                // WebGPU has no gl_PointSize, so we render each particle as
                // a small quad. Per-vertex: quad corners + UVs. Per-instance:
                // random, position, velocity (position/velocity copied from compute).
                const quadPositions = new Float32Array([
                    -0.5, -0.5,
                     0.5, -0.5,
                     0.5,  0.5,
                    -0.5,  0.5,
                ]);
                const quadUvs = new Float32Array([
                    0, 0,
                    1, 0,
                    1, 1,
                    0, 1,
                ]);
                const quadIndex = new Uint16Array([0, 1, 2, 0, 2, 3]);

                const geometry = new Geometry(renderer, {
                    quadPos: { size: 2, data: quadPositions },
                    quadUv: { size: 2, data: quadUvs },
                    index: { data: quadIndex },
                    random: { instanced: 1, size: 4, data: randomData },
                    position: { instanced: 1, size: 4, data: new Float32Array(numParticles * 4) },
                    velocity: { instanced: 1, size: 4, data: new Float32Array(numParticles * 4) },
                });

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        uResolution: { value: new Float32Array([renderer.canvas.width, renderer.canvas.height]) },
                    },
                    cullFace: false,
                    depthTest: false,
                });

                const points = new Mesh(renderer, { geometry, program });

                // ---------------------------------------------------------------
                // Mouse handling
                // ---------------------------------------------------------------
                const mouse = new Vec2();

                const isTouchCapable = 'ontouchstart' in window;
                if (isTouchCapable) {
                    window.addEventListener('touchstart', updateMouse, false);
                    window.addEventListener('touchmove', updateMouse, false);
                } else {
                    window.addEventListener('mousemove', updateMouse, false);
                }

                function updateMouse(e) {
                    if (e.changedTouches && e.changedTouches.length) {
                        e.x = e.changedTouches[0].pageX;
                        e.y = e.changedTouches[0].pageY;
                    }
                    if (e.x === undefined) {
                        e.x = e.pageX;
                        e.y = e.pageY;
                    }

                    // Get mouse value in -1 to 1 range, with y flipped
                    mouse.set(
                        (e.x / renderer.width) * 2 - 1,
                        (1 - e.y / renderer.height) * 2 - 1
                    );
                }

                // ---------------------------------------------------------------
                // Render loop
                // ---------------------------------------------------------------
                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    const time = t * 0.001;
                    program.uniforms.uTime.value = time;
                    program.uniforms.uResolution.value[0] = renderer.canvas.width;
                    program.uniforms.uResolution.value[1] = renderer.canvas.height;

                    // Update compute uniforms
                    compute.updateUniform('params', new Float32Array([time, mouse[0], mouse[1], 0]));

                    // Run compute shader to update positions and velocities
                    compute.run();

                    // Copy computed position and velocity data from storage buffers
                    // to the geometry vertex buffers (GPU-to-GPU, no readback).
                    const commandEncoder = renderer.device.createCommandEncoder();
                    commandEncoder.copyBufferToBuffer(
                        compute.storageBuffers.positions, 0,
                        geometry.attributes.position.buffer, 0,
                        numParticles * 4 * 4
                    );
                    commandEncoder.copyBufferToBuffer(
                        compute.storageBuffers.velocities, 0,
                        geometry.attributes.velocity.buffer, 0,
                        numParticles * 4 * 4
                    );
                    renderer.device.queue.submit([commandEncoder.finish()]);

                    // Render the particles
                    renderer.render({ scene: points, camera });
                }
            }
        </script>
    </body>
</html>
