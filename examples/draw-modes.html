<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Draw Modes</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Draw Modes</div>
        <script type="module">
            import { Renderer, Camera, Transform, Geometry, Program, Mesh } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };
                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };
                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };
                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let c = 0.5 + 0.3 * sin(vec3f(input.vUv.y, input.vUv.x, input.vUv.x) + material.uTime) + vec3f(0.2, 0.0, 0.1);
                    return vec4f(c, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create();
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 15 });
                camera.position.z = 15;

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                // Geometry is an indexed square, comprised of 4 vertices.
                const geometry = new Geometry(renderer, {
                    position: { size: 3, data: new Float32Array([-0.5, 0.5, 0, -0.5, -0.5, 0, 0.5, 0.5, 0, 0.5, -0.5, 0]) },
                    uv: { size: 2, data: new Float32Array([0, 1, 1, 1, 0, 0, 1, 0]) },
                    index: { data: new Uint16Array([0, 1, 2, 1, 3, 2]) },
                });

                // Each draw mode requires its own Program with a different topology in WebGPU.
                // Note: WebGPU does not have gl_PointSize - points are always 1px.
                const pointProgram = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                    },
                    topology: 'point-list',
                });

                const lineProgram = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                    },
                    topology: 'line-list',
                });

                const lineStripProgram = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                    },
                    topology: 'line-strip',
                });

                const triangleProgram = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                    },
                });

                // point-list: draws points at each vertex (6 indices, with 2 duplicates due to the geometry indices).
                // Note: WebGPU points are always 1px - there is no equivalent to gl_PointSize.
                const points = new Mesh(renderer, { geometry, program: pointProgram });
                points.setParent(scene);
                points.position.set(-1, 1, 0);

                // line-list: draws a line between each pair of vertices.
                // Ideal use for separated lines.
                const lines = new Mesh(renderer, { geometry, program: lineProgram });
                lines.setParent(scene);
                lines.position.set(1, 1, 0);

                // line-strip: draws a continuous line through each vertex in order.
                // This is the closest equivalent to the old LINE_LOOP, but does not connect the last vertex back to the first.
                const lineStrip = new Mesh(renderer, { geometry, program: lineStripProgram });
                lineStrip.setParent(scene);
                lineStrip.position.set(-1, -1, 0);

                // triangle-list: draws a triangle between each set of 3 vertices.
                // This is the default topology, so it doesn't need to be explicitly set.
                const triangles = new Mesh(renderer, { geometry, program: triangleProgram });
                triangles.setParent(scene);
                triangles.position.set(1, -1, 0);

                // OTHER MODES NOT FEATURED:
                // triangle-strip: draws triangles in a criss-cross pattern. Ideal for ribbons.
                // For example, in order to draw a rectangle, only 4 vertices needed (unlike 6 with triangle-list).
                // The 4 vertices should follow the below pattern.
                //
                // 0--2
                // | /|
                // |/ |
                // 1--3

                // Note: WebGPU does not support LINE_LOOP or TRIANGLE_FAN topologies.

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    const time = t * 0.001;
                    pointProgram.uniforms.uTime.value = time;
                    lineProgram.uniforms.uTime.value = time;
                    lineStripProgram.uniforms.uTime.value = time;
                    triangleProgram.uniforms.uTime.value = time;

                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
