<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Scene Graph Hierarchy</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Scene Graph Hierarchy</div>
        <script type="module">
            import { Renderer, Camera, Program, Transform, Mesh, Sphere, Box } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vNormal : vec3f,
                    @location(1) vMVPos : vec4f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.vMVPos = object.modelViewMatrix * vec4f(input.position, 1.0);
                    output.position = object.projectionMatrix * output.vMVPos;
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct FragmentInput {
                    @location(0) vNormal : vec3f,
                    @location(1) vMVPos : vec4f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let normal = normalize(input.vNormal);
                    let lighting = dot(normal, normalize(vec3f(-0.3, 0.8, 0.6)));
                    var color = vec3f(1.0, 0.5, 0.2) * (1.0 - 0.5 * lighting) + input.vMVPos.xzy * 0.1;

                    let dist = length(input.vMVPos.xyz);
                    let fog = smoothstep(4.0, 10.0, dist);
                    color = mix(color, vec3f(1.0), fog);

                    return vec4f(color, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 1, 7);
                camera.lookAt([0, 0, 0]);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const sphereGeometry = new Sphere(renderer, { radius: 0.15 });
                const cubeGeometry = new Box(renderer, { width: 0.3, height: 0.3, depth: 0.3 });

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                });

                const scene = new Transform();

                const sphere = new Mesh(renderer, { geometry: sphereGeometry, program });
                sphere.speed = -0.5;
                sphere.setParent(scene);

                const shapes = [sphere];

                for (let i = 0; i < 50; i++) {
                    const geometry = Math.random() > 0.5 ? cubeGeometry : sphereGeometry;
                    const shape = new Mesh(renderer, { geometry, program });
                    shape.scale.set(Math.random() * 0.3 + 0.7);
                    shape.position.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
                    shape.speed = (Math.random() - 0.5) * 0.7;

                    shape.setParent(shapes[Math.floor(Math.random() * shapes.length)]);
                    shapes.push(shape);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    shapes.forEach((shape) => {
                        shape.rotation.y += 0.03 * shape.speed;
                        shape.rotation.x += 0.04 * shape.speed;
                        shape.rotation.z += 0.01 * shape.speed;
                    });

                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
