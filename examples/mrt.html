<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • MRT (Multiple Render Targets)</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info" style="color: #fff">MRT (Multiple Render Targets)</div>
        <script type="module">
            import { Renderer, Camera, Transform, Geometry, Texture, RenderTarget, Program, Mesh, Vec3, Orbit, Triangle } from '../src/index.js';

            const vertex = /* wgsl */ `
                @group(0) @binding(0) var tMapTex : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                    @location(3) offset : vec3f,
                    @location(4) random : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vMPos : vec3f,
                };

                fn rotate2d(v : vec2f, a : f32) -> vec2f {
                    return mat2x2f(cos(a), -sin(a), sin(a), cos(a)) * v;
                }

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    var pos = input.position;
                    pos *= 0.8 + input.random.y * 0.3;
                    let rxz = rotate2d(pos.xz, input.random.x * 6.28 + 4.0 * (input.random.y - 0.5));
                    pos = vec3f(rxz.x, pos.y, rxz.y);
                    let rzy = rotate2d(pos.zy, input.random.z * 0.9 * sin(input.random.x + input.random.z * 3.14));
                    pos = vec3f(pos.x, rzy.y, rzy.x);
                    pos += input.offset * vec3f(2.5, 0.2, 2.5);

                    output.vUv = input.uv;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.vMPos = (object.modelMatrix * vec4f(pos, 1.0)).xyz;
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(pos, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                @group(0) @binding(0) var tMapTex : texture_2d<f32>;
                @group(0) @binding(1) var tMapSampler : sampler;

                struct FragmentInput {
                    @builtin(position) fragCoord : vec4f,
                    @location(0) vUv : vec2f,
                    @location(1) vNormal : vec3f,
                    @location(2) vMPos : vec3f,
                };

                struct FragOutput {
                    @location(0) color : vec4f,
                    @location(1) posDepth : vec4f,
                };

                @fragment fn main(input : FragmentInput) -> FragOutput {
                    var output : FragOutput;
                    output.color = textureSample(tMapTex, tMapSampler, input.vUv);
                    output.posDepth = vec4f(input.vMPos, input.fragCoord.z);
                    return output;
                }
            `;

            const vertexPost = /* wgsl */ `
                struct VertexInput {
                    @location(0) position : vec2f,
                    @location(1) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = vec2f(input.uv.x, 1.0 - input.uv.y);
                    output.position = vec4f(input.position, 0.0, 1.0);
                    return output;
                }
            `;

            const fragmentPost = /* wgsl */ `
                struct MaterialUniforms {
                    uLights : array<vec4f, 10>,
                    uAspect : f32,
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tColorTex : texture_2d<f32>;
                @group(0) @binding(2) var tColorSampler : sampler;
                @group(0) @binding(3) var tPositionTex : texture_2d<f32>;
                @group(0) @binding(4) var tPositionSampler : sampler;

                struct FragmentInput {
                    @builtin(position) fragCoord : vec4f,
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let color_raw = textureSample(tColorTex, tColorSampler, input.vUv).rgb;
                    let posData = textureSample(tPositionTex, tPositionSampler, input.vUv);
                    let depth = posData.a;
                    var color = color_raw;

                    var lights = vec3f(0.0);
                    for (var i = 0u; i < 10u; i++) {
                        let posXZ = posData.xyz * vec3f(1.0, 0.0, 1.0);
                        let l = material.uLights[i].xyz;
                        let lPos = sin(l.xyz * material.uTime + l.zyx * 6.28) * vec3f(2.0, 0.5, 2.0);
                        let strength = max(0.0, 1.0 - length(posXZ - lPos));
                        lights = max(lights, (vec3f(1.0) - normalize(l)) * strength);
                    }
                    color *= lights;

                    // Fade to black in distance
                    color = mix(color, vec3f(0.0), smoothstep(0.8, 1.05, pow(depth, 3.0)));

                    var result = vec4f(color, 1.0);

                    // Render raw render targets in corner
                    // Flip fragCoord.y so strips appear at bottom-left (matching WebGL convention)
                    // Sample outside of non-uniform control flow (WGSL requirement)
                    let screenHeight = f32(textureDimensions(tColorTex).y);
                    let uv = vec2f(input.fragCoord.x, screenHeight - input.fragCoord.y) / vec2f(250.0 * material.uAspect, 250.0);
                    let debugUv = vec2f((uv % vec2f(1.0)).x, 1.0 - (uv % vec2f(1.0)).y);
                    let debugPos = textureSample(tPositionTex, tPositionSampler, debugUv);
                    let debugColor = textureSample(tColorTex, tColorSampler, debugUv);
                    if (uv.y < 1.0 && uv.x < 1.0) {
                        result = vec4f(vec3f(debugPos.a), 1.0);
                    } else if (uv.y < 2.0 && uv.x < 1.0) {
                        result = vec4f(debugPos.rgb, 1.0);
                    } else if (uv.y < 3.0 && uv.x < 1.0) {
                        result = vec4f(debugColor.rgb, 1.0);
                    }
                    return result;
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 0, g: 0, b: 0, a: 1 };

                const camera = new Camera(renderer, { fov: 45 });
                camera.position.set(0, 2, 5);

                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const target = new RenderTarget(renderer, {
                    color: 2,
                    format: 'rgba16float',
                });

                // Scene to render to targets
                initScene();

                // Mesh to render to canvas
                const post = initPost();

                async function initScene() {
                    const data = await (await fetch(`assets/acorn.json`)).json();

                    // Instanced buffers
                    const num = 100;
                    let offset = new Float32Array(num * 3);
                    let random = new Float32Array(num * 3);
                    for (let i = 0; i < num; i++) {
                        offset.set([Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1], i * 3);
                        random.set([Math.random(), Math.random(), Math.random()], i * 3);
                    }

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },
                        offset: { instanced: 1, size: 3, data: offset },
                        random: { instanced: 1, size: 3, data: random },
                    });

                    const texture = new Texture(renderer);
                    const img = new Image();
                    img.onload = () => (texture.image = img);
                    img.src = 'assets/acorn.jpg';

                    const program = new Program(renderer, {
                        vertex,
                        fragment,
                        uniforms: {
                            tMap: { value: texture },
                        },
                    });

                    const mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                function initPost() {
                    const geometry = new Triangle(renderer);

                    // Create 10 random lights
                    const lights = [];
                    for (let i = 0; i < 10; i++) {
                        lights.push(new Vec3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1));
                    }

                    const program = new Program(renderer, {
                        vertex: vertexPost,
                        fragment: fragmentPost,
                        uniforms: {
                            tColor: { value: target.textures[0] },
                            tPosition: { value: target.textures[1] },
                            uLights: { value: lights },
                            uAspect: { value: 1 },
                            uTime: { value: 0 },
                        },
                    });

                    return new Mesh(renderer, { geometry, program });
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    controls.update();

                    // Render scene to targets
                    renderer.render({ scene, camera, target });

                    // Update resolution
                    post.program.uniforms.uAspect.value = renderer.width / renderer.height;
                    post.program.uniforms.uTime.value = t * 0.001;

                    // Render post to canvas
                    renderer.render({ scene: post });
                }
            }
        </script>
    </body>
</html>
