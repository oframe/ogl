<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Simple Fresnel Shader</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>

    <body>
        <div class="Info">Simple Fresnel Shader</div>
        <script type="module">
            import { Renderer, Camera, Orbit, Transform, Program, Torus, Mesh, Color } from '../src/index.js';

            const params = {
                backgroundColor: new Color('#B6D8F2'),
                baseColor: new Color('#B6D8F2'),
                fresnelColor: new Color('#F7F6CF'),
                fresnelFactor: 1.5,
            };

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uBaseColor : vec3f,
                    uFresnelColor : vec3f,
                    uFresnelPower : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vWorldNormal : vec3f,
                    @location(1) vViewDirection : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    let worldPosition = object.modelMatrix * vec4f(input.position, 1.0);
                    output.vWorldNormal = normalize((object.modelMatrix * vec4f(input.normal, 0.0)).xyz);
                    output.vViewDirection = normalize(object.cameraPosition - worldPosition.xyz);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uBaseColor : vec3f,
                    uFresnelColor : vec3f,
                    uFresnelPower : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;

                struct FragmentInput {
                    @location(0) vWorldNormal : vec3f,
                    @location(1) vViewDirection : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    var fresnelFactor = abs(dot(input.vViewDirection, input.vWorldNormal));
                    var inversefresnelFactor = 1.0 - fresnelFactor;

                    // Shaping function
                    fresnelFactor = pow(fresnelFactor, material.uFresnelPower);
                    inversefresnelFactor = pow(inversefresnelFactor, material.uFresnelPower);

                    return vec4f(fresnelFactor * material.uBaseColor + inversefresnelFactor * material.uFresnelColor, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 1, 7);
                camera.lookAt([0, 0, 0]);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();
                const controls = new Orbit(camera);

                const uniforms = {
                    uBaseColor: { value: params.baseColor },
                    uFresnelColor: { value: params.fresnelColor },
                    uFresnelPower: { value: params.fresnelFactor },
                };

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms,
                });

                const torusGeometry = new Torus(renderer, {
                    radius: 1,
                    tube: 0.4,
                    radialSegments: 32,
                    tubularSegments: 64,
                });

                const torus = new Mesh(renderer, { geometry: torusGeometry, program });
                torus.setParent(scene);

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    torus.rotation.x += 0.01;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
