<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Instancing</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="Info">Instancing. Model by Google Poly</div>
        <script type="module">
            import { Renderer, Camera, Transform, Texture, Program, Geometry, Mesh } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMap : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) uv : vec2f,
                    @location(2) normal : vec3f,
                    @location(3) offset : vec3f,
                    @location(4) random : vec3f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vUv : vec2f,
                };

                fn rotate2d(v : vec2f, a : f32) -> vec2f {
                    let m = mat2x2f(cos(a), -sin(a), sin(a), cos(a));
                    return m * v;
                }

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vUv = input.uv;

                    // copy position so that we can modify the instances
                    var pos = input.position;

                    // scale first
                    pos *= 0.9 + input.random.y * 0.2;

                    // rotate around y axis
                    let xz = rotate2d(pos.xz, input.random.x * 6.28 + 4.0 * material.uTime * (input.random.y - 0.5));
                    pos.x = xz.x;
                    pos.z = xz.y;

                    // rotate around x axis just to add some extra variation
                    let zy = rotate2d(pos.zy, input.random.z * 0.5 * sin(material.uTime * input.random.x + input.random.z * 3.14));
                    pos.z = zy.x;
                    pos.y = zy.y;

                    pos += input.offset;

                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(pos, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct MaterialUniforms {
                    uTime : f32,
                };

                @group(0) @binding(0) var<uniform> material : MaterialUniforms;
                @group(0) @binding(1) var tMap : texture_2d<f32>;
                @group(0) @binding(2) var tMapSampler : sampler;

                struct FragmentInput {
                    @location(0) vUv : vec2f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let tex = textureSample(tMap, tMapSampler, input.vUv).rgb;
                    return vec4f(tex, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);
                renderer.clearColor = { r: 1, g: 1, b: 1, a: 1 };

                const camera = new Camera(renderer, { fov: 15 });
                camera.position.z = 15;

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const texture = new Texture(renderer);
                const img = new Image();
                img.onload = () => (texture.image = img);
                img.src = 'assets/acorn.jpg';

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    uniforms: {
                        uTime: { value: 0 },
                        tMap: { value: texture },
                    },
                });

                let mesh;
                loadModel();
                async function loadModel() {
                    const data = await (await fetch(`assets/acorn.json`)).json();

                    const num = 20;

                    let offset = new Float32Array(num * 3);
                    let random = new Float32Array(num * 3);
                    for (let i = 0; i < num; i++) {
                        offset.set([Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1], i * 3);

                        // unique random values are always handy for instances.
                        // Here they will be used for rotation, scale and movement.
                        random.set([Math.random(), Math.random(), Math.random()], i * 3);
                    }

                    const geometry = new Geometry(renderer, {
                        position: { size: 3, data: new Float32Array(data.position) },
                        uv: { size: 2, data: new Float32Array(data.uv) },
                        normal: { size: 3, data: new Float32Array(data.normal) },

                        // simply add the 'instanced' property to flag as an instanced attribute.
                        // set the value as the divisor number
                        offset: { instanced: 1, size: 3, data: offset },
                        random: { instanced: 1, size: 3, data: random },
                    });

                    mesh = new Mesh(renderer, { geometry, program });
                    mesh.setParent(scene);
                }

                requestAnimationFrame(update);
                function update(t) {
                    requestAnimationFrame(update);

                    if (mesh) mesh.rotation.y -= 0.005;
                    program.uniforms.uTime.value = t * 0.001;
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
