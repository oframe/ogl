<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="viewport" content="width=device-width, minimal-ui, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />

        <title>OGL • Base Primitives - Plane, Cube, Sphere, Cylinder</title>
        <link href="assets/main.css" rel="stylesheet" />
    </head>

    <body>
        <div class="Info">Base Primitives - Plane, Cube, Sphere, Cylinder</div>
        <script type="module">
            import { Renderer, Camera, Transform, Program, Mesh, Plane, Sphere, Box, Cylinder, Orbit } from '../src/index.js';

            const vertex = /* wgsl */ `
                struct ObjectUniforms {
                    modelMatrix : mat4x4f,
                    viewMatrix : mat4x4f,
                    modelViewMatrix : mat4x4f,
                    projectionMatrix : mat4x4f,
                    normalMatrix : mat3x3f,
                    cameraPosition : vec3f,
                };

                @group(1) @binding(0) var<uniform> object : ObjectUniforms;

                struct VertexInput {
                    @location(0) position : vec3f,
                    @location(1) normal : vec3f,
                    @location(2) uv : vec2f,
                };

                struct VertexOutput {
                    @builtin(position) position : vec4f,
                    @location(0) vNormal : vec3f,
                };

                @vertex fn main(input : VertexInput) -> VertexOutput {
                    var output : VertexOutput;
                    output.vNormal = normalize(object.normalMatrix * input.normal);
                    output.position = object.projectionMatrix * object.modelViewMatrix * vec4f(input.position, 1.0);
                    return output;
                }
            `;

            const fragment = /* wgsl */ `
                struct FragmentInput {
                    @location(0) vNormal : vec3f,
                };

                @fragment fn main(input : FragmentInput) -> @location(0) vec4f {
                    let normal = normalize(input.vNormal);
                    let lighting = dot(normal, normalize(vec3f(-0.3, 0.8, 0.6)));
                    let color = vec3f(0.2, 0.8, 1.0) + lighting * 0.1;
                    return vec4f(color, 1.0);
                }
            `;

            {
                const renderer = await Renderer.create({ dpr: 2 });
                document.body.appendChild(renderer.canvas);

                const camera = new Camera(renderer, { fov: 35 });
                camera.position.set(0, 1, 7);
                camera.lookAt([0, 0, 0]);
                const controls = new Orbit(camera);

                function resize() {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    camera.perspective({ aspect: renderer.canvas.width / renderer.canvas.height });
                }
                window.addEventListener('resize', resize, false);
                resize();

                const scene = new Transform();

                const planeGeometry = new Plane(renderer);
                const sphereGeometry = new Sphere(renderer);
                const cubeGeometry = new Box(renderer);
                const cylinderGeometry = new Cylinder(renderer);

                const program = new Program(renderer, {
                    vertex,
                    fragment,
                    cullFace: false,
                });

                const plane = new Mesh(renderer, { geometry: planeGeometry, program });
                plane.position.set(0, 1.3, 0);
                plane.setParent(scene);

                const sphere = new Mesh(renderer, { geometry: sphereGeometry, program });
                sphere.position.set(1.3, 0, 0);
                sphere.setParent(scene);

                const cube = new Mesh(renderer, { geometry: cubeGeometry, program });
                cube.position.set(0, -1.3, 0);
                cube.setParent(scene);

                const cylinder = new Mesh(renderer, { geometry: cylinderGeometry, program });
                cylinder.position.set(-1.3, 0, 0);
                cylinder.setParent(scene);

                requestAnimationFrame(update);
                function update() {
                    requestAnimationFrame(update);

                    plane.rotation.y -= 0.02;
                    sphere.rotation.y -= 0.03;
                    cube.rotation.y -= 0.04;
                    cylinder.rotation.y -= 0.02;

                    controls.update();
                    renderer.render({ scene, camera });
                }
            }
        </script>
    </body>
</html>
